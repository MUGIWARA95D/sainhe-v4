name: SAINHE — Stock Analysis (prix quotidiens · dépôts trimestriels)

# Deux régimes (étape « Régime ») :
#   - CHAQUE JOUR OUVRÉ, après la clôture US : prix, change, taux, bêtas, consensus, Labo,
#     Monte Carlo et crises recalculés ; les dépôts EDGAR/ESEF sont relus depuis le cache
#     (TTL 120 j) — aucun nouveau téléchargement de rapports ;
#   - CHAQUE TRIMESTRE, après les saisons de dépôt (10-K début mars ; 10-Q et rapports ESEF
#     mi-mai, mi-août, mi-novembre) : dépôts rafraîchis (TTL 1 j), cache réenregistré.
#   Lancement manuel : case « filings » pour forcer le rafraîchissement des dépôts.
# Chaque exécution :
#   1. tests du backend (115 + 61 assertions, hermétiques) et du front (Node)
#   2. sainhe_backend/pipeline.py --coverage : US 10-K + ADR 20-F (SEC EDGAR) + Europe ESEF
#      (filings.xbrl.org) → un nouveau 10-K / 20-F / rapport ESEF est capté automatiquement
#      dans la semaine qui suit sa publication (automatisation annuelle du XBRL)
#   3. portfolio_runner.py : Portfolio Sim en USD / EUR / CHF / HKD
#   4. quality_check.py : recoupement XBRL vs yfinance, régressions N/D, fraîcheur
#   5. commit de data/stock/ sur dev (git = historique versionné des analyses, plan §6)
#   6. redéploiement : les JSON ne sont publiés QUE sur la preview (STOCK_ANALYSIS_LIVE=true)
#   7. issue GitHub ouverte si anomalies, fermée automatiquement quand tout redevient sain
#
# Prérequis : secret EDGAR_CONTACT_EMAIL (la SEC exige un email de contact dans le User-Agent) :
#   gh secret set EDGAR_CONTACT_EMAIL --repo MUGIWARA95D/sainhe-v4
# Doit vivre sur main (les déclencheurs schedule ne tournent que depuis la branche par défaut).

on:
  schedule:
    - cron: "45 22 * * 1-5"      # prix : chaque jour ouvré après la clôture US
    - cron: "30 5 5 3 *"         # dépôts : après la saison des 10-K
    - cron: "30 5 15 5,8,11 *"   # dépôts : après chaque saison de 10-Q / ESEF
  workflow_dispatch:
    inputs:
      filings:
        description: "Rafraîchir aussi les dépôts EDGAR / ESEF"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  stock:
    name: Stock Analysis + Portfolio Sim
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_TITLE: "[auto] Stock Analysis — anomalies de données"

    steps:
      - name: Secret EDGAR_CONTACT_EMAIL présent ?
        run: |
          if [ -z "$EDGAR_CONTACT_EMAIL" ]; then
            echo "::error::Secret EDGAR_CONTACT_EMAIL manquant. À créer : gh secret set EDGAR_CONTACT_EMAIL --repo $REPO"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0     # historique complet : le pull --rebase avant push en a besoin

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sainhe_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r sainhe_backend/requirements.txt

      - name: Régime (prix quotidiens ou dépôts trimestriels)
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 5 3 *"|"30 5 15 5,8,11 *") filings=true ;;
            *) filings="${{ inputs.filings == true }}" ;;
          esac
          if [ "$filings" = "true" ]; then days=1; else days=120; fi
          echo "filings=$filings" >> "$GITHUB_OUTPUT"
          echo "SAINHE_EDGAR_CACHE_DAYS=$days" >> "$GITHUB_ENV"
          echo "SAINHE_ESEF_CACHE_DAYS=$days" >> "$GITHUB_ENV"
          echo "Dépôts rafraîchis : $filings (TTL cache $days j)"

      # Cache EDGAR + ESEF : relu chaque jour, réenregistré seulement quand les dépôts sont
      # rafraîchis (ou s'il n'existe pas encore). Les rapports ESEF (≈ 4 Mo, immuables) ne
      # sont téléchargés qu'une fois.
      - name: Restore XBRL cache
        id: xbrl
        uses: actions/cache/restore@v4
        with:
          path: sainhe_backend/cache
          key: sainhe-xbrl-${{ github.run_id }}
          restore-keys: sainhe-xbrl-

      - name: Tests (hermétiques, sans réseau)
        working-directory: sainhe_backend
        run: |
          python tests/test_pipeline.py
          python tests/test_full.py

      - name: Front tests (Stock Analysis, Node)
        run: node tests_front/test_calc.js

      - name: Stock Analysis (EDGAR 10-K/20-F + ESEF)
        working-directory: sainhe_backend
        run: python pipeline.py --coverage

      - name: Save XBRL cache
        if: steps.mode.outputs.filings == 'true' || steps.xbrl.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: sainhe_backend/cache
          key: sainhe-xbrl-${{ github.run_id }}

      - name: Portfolio Sim (USD, EUR, CHF, HKD)
        working-directory: sainhe_backend
        run: python portfolio_runner.py

      - name: Contrôle qualité
        id: quality
        working-directory: sainhe_backend
        run: |
          python quality_check.py | tee /tmp/quality.json
          echo "issues=$(jq -r '.n_issues' /tmp/quality.json)" >> "$GITHUB_OUTPUT"
          echo "stale=$(jq -r '.n_stale' /tmp/quality.json)" >> "$GITHUB_OUTPUT"

      - name: Commit data/stock sur dev
        run: |
          git config user.name "sainhe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock
          if git diff --cached --quiet; then
            echo "Aucun changement dans data/stock"
          else
            if [ "${{ steps.mode.outputs.filings }}" = "true" ]; then what="dépôts et prix"; else what="prix du jour"; fi
            git commit -m "data(stock): $what $(date -u +%F)"
            git pull --rebase --autostash origin dev
            git push origin HEAD:dev
          fi

      # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow, sauf
      # repository_dispatch : on relance le job « news » (rendu + déploiement léger).
      - name: Redéployer le site (preview incluse)
        run: gh api "repos/$REPO/dispatches" -f event_type=news

      - name: Alerte qualité (issue ouverte / fermée)
        if: always()
        run: |
          set -euo pipefail
          n="${{ steps.quality.outputs.issues }}"
          open=$(gh issue list -R "$REPO" --state open --search "\"$ISSUE_TITLE\" in:title" --json number -q '.[0].number // empty')
          run_url="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          if [ -z "$n" ]; then
            echo "Contrôle qualité non exécuté (étape précédente en échec)"; exit 0
          fi
          if [ "$n" != "0" ]; then
            body="Le contrôle hebdomadaire a trouvé **$n anomalie(s)** (écarts XBRL vs yfinance, régressions N/D ou échecs du pipeline).

          Détail : \`data/stock/quality_report.json\` sur la branche dev · exécution : $run_url"
            # une issue ouverte n'est commentée qu'aux rafraîchissements de dépôts (pas chaque jour)
            if [ -z "$open" ]; then gh issue create -R "$REPO" --title "$ISSUE_TITLE" --body "$body"
            elif [ "${{ steps.mode.outputs.filings }}" = "true" ]; then gh issue comment "$open" -R "$REPO" --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$REPO" --comment "Contrôle qualité propre ($run_url). Fermeture automatique."
          fi
