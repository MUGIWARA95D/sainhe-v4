<script>
/* ══════ STOCK ANALYSIS — phase 1 ═════════════════════════════════════════
 * 1. Quality × Price map      (valuation map, embedded)
 * 2. "What you have to believe" simulator  (reverse DCF on the user's inputs)
 * 3. Every number → its source (drawer: formula, inputs, XBRL tag, filing link)
 * 4. Allocation Lab           (weights, rival swap, currency lens — lab_data.json)
 * 5. Crisis replay            (the Lab allocation through 5 stress windows)
 * Zero prediction: everything is arithmetic on filed numbers or past prices.
 * ═════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
if(!window.Chart) return;
const VM = JSON.parse((document.getElementById('sa-vmap')||{}).textContent || '{}') || {};
const ROWS = (VM.rows || []).slice();
const BASE = '/data/stock/';
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const isNum = v => typeof v === 'number' && isFinite(v);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NDH = '<span class="sa-nd">N/D</span>';
const H = t => t === 'N/D' ? NDH : esc(t);               // plain text → safe HTML (N/D greyed)
const pct = (v, d) => { if(!isNum(v)) return 'N/D'; const s = Math.abs(v * 100).toFixed(d == null ? 1 : d); return (v < 0 && +s !== 0 ? '−' : '') + s + '%'; };
function signed(v, d, unit){ if(!isNum(v)) return 'N/D'; const s = Math.abs(v * 100).toFixed(d == null ? 1 : d); return (+s === 0 ? '±' : v > 0 ? '+' : '−') + s + unit; }
const pctS = (v, d) => signed(v, d, '%');
const pts = (v, d) => signed(v, d, ' pts');
function niceMax(v){ if(!(v > 0)) return 1; const m = Math.pow(10, Math.floor(Math.log10(v))) / 2; return Math.ceil(v / m) * m; }
const num = (v, d) => isNum(v) ? v.toLocaleString('en-US', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}).replace(/^-/, '−') : 'N/D';
function big(v, cur){
  if(!isNum(v)) return 'N/D';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  let s;
  if(a >= 1e12) s = (a / 1e12).toFixed(2) + ' tn';
  else if(a >= 1e9) s = (a / 1e9).toFixed(1) + ' bn';
  else if(a >= 1e6) s = (a / 1e6).toFixed(1) + ' m';
  else s = a.toLocaleString('en-US', {maximumFractionDigits: 2});
  return (cur ? cur + ' ' : '') + sg + s;
}
const money = (v, cur) => isNum(v) ? (cur ? cur + ' ' : '') + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/D';
function median(a){ const s = a.filter(isNum).sort((x, y) => x - y); if(!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
function series(obj){ return Object.keys(obj || {}).filter(k => isNum(obj[k])).sort().map(k => [k, obj[k]]); }
function lastOf(obj){ const s = series(obj); return s.length ? s[s.length - 1] : null; }

/* ── theme-aware colours (series palette validated, see _sa_style.html) ── */
function cssv(n, el){ return getComputedStyle(el || document.documentElement).getPropertyValue(n).trim(); }
function pal(){
  const sa = $('.sa');
  return {s1: cssv('--s1', sa), s2: cssv('--s2', sa), s3: cssv('--s3', sa),
    h: cssv('--h'), p: cssv('--p'), muted: cssv('--muted'), faint: cssv('--faint'), grid: cssv('--border-lt'),
    border: cssv('--border'), card: cssv('--card'), goldBg: cssv('--gold-bg'), gold: cssv('--gold')};
}
const FONT = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.family = FONT;
Chart.defaults.font.size = 11;
const restyle = [];
new MutationObserver(() => restyle.forEach(f => { try{ f(); }catch(e){ console.error(e); } }))
  .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
function axis(P, extra){
  return Object.assign({grid: {color: P.grid, drawTicks: false}, border: {display: false},
    ticks: {color: P.muted, padding: 6}}, extra || {});
}
function tip(P){
  return {backgroundColor: P.card, titleColor: P.h, bodyColor: P.p, borderColor: P.border, borderWidth: 1,
    padding: 10, cornerRadius: 8, displayColors: true, boxPadding: 4, usePointStyle: true};
}

/* ── data ── */
const cache = {};
function getJSON(name){
  if(!cache[name]) cache[name] = fetch(BASE + name).then(r => { if(!r.ok) throw new Error(name + ' HTTP ' + r.status); return r.json(); });
  return cache[name];
}
const report = t => getJSON(encodeURIComponent(t) + '_report.json');

ROWS.forEach(r => {
  const m = /^(\d+)\s*\/\s*(\d+)$/.exec(String(r.roic_years_above_wacc || ''));
  r.roic_share = m && +m[2] > 0 ? (+m[1]) / (+m[2]) : null;
  r.roic_txt = m ? m[1] + '/' + m[2] + ' yrs' : 'N/D';
  r.src_kind = /20-F/.test(r.source || '') ? '20-F' : /ESEF/.test(r.source || '') ? 'ESEF' : '10-K';
  ['implied_growth', 'sgr', 'ecart_pct', 'prix', 'epv_per_share', 're_per_share', 'rf'].forEach(k => { if(!isNum(r[k])) r[k] = null; });
});
const ROW = {}; ROWS.forEach(r => { ROW[r.ticker] = r; });
const SRC_NAME = {'10-K': 'US 10-K', '20-F': 'Foreign 20-F', 'ESEF': 'Europe ESEF'};
const asOf = $('#sa-asof'); if(asOf && VM.as_of) asOf.textContent = 'as of ' + VM.as_of;

/* ═════════════ 1 · QUALITY × PRICE MAP ═════════════ */
const mapState = {src: 'all', hideStale: false};
let mapChart = null, selected = null;
const SHAPE = {'10-K': 'circle', '20-F': 'triangle', 'ESEF': 'rectRot'};
const SLOT = {'10-K': 's1', '20-F': 's2', 'ESEF': 's3'};
const rfRef = median(ROWS.map(r => r.rf));
function mapVisible(){
  return ROWS.filter(r => (mapState.src === 'all' || r.src_kind === mapState.src) && !(mapState.hideStale && r.stale_financials));
}
const quadPlugin = {
  id: 'saQuad',
  beforeDatasetsDraw(chart){
    const {ctx, chartArea: a, scales: {x, y}} = chart, P = pal();
    if(!isNum(rfRef)) return;
    const xp = Math.min(Math.max(x.getPixelForValue(rfRef), a.left), a.right), yp = y.getPixelForValue(0.5);
    const narrow = a.right - a.left < 520;
    ctx.save();
    ctx.globalAlpha = .6; ctx.fillStyle = P.goldBg; ctx.fillRect(a.left, a.top, xp - a.left, yp - a.top); ctx.globalAlpha = 1;
    ctx.strokeStyle = P.muted; ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(xp, a.top); ctx.lineTo(xp, a.bottom); ctx.stroke();
    ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(a.left, yp); ctx.lineTo(a.right, yp); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '600 9.5px ' + FONT; ctx.fillStyle = P.muted; ctx.textBaseline = 'alphabetic';
    const L = narrow ? ['PROVEN · MODEST', 'PROVEN · DEMANDING', 'UNPROVEN · MODEST', 'UNPROVEN · DEMANDING']
                     : ['PROVEN RETURNS · MODEST EXPECTATIONS', 'PROVEN RETURNS · DEMANDING EXPECTATIONS',
                        'UNPROVEN RETURNS · MODEST EXPECTATIONS', 'UNPROVEN RETURNS · DEMANDING EXPECTATIONS'];
    // every text drawn here is an obstacle for the ticker labels (afterDatasetsDraw)
    const obs = chart.$saObs = [];
    const put = (txt, x, y, align) => { const w = ctx.measureText(txt).width, x0 = align === 'right' ? x - w : x;
      ctx.textAlign = 'left'; ctx.fillText(txt, x0, y); obs.push({x: x0 - 2, y: y - 10, w: w + 4, h: 13}); };
    put(L[0], a.left + 8, a.top + 14, 'left');
    put(L[1], a.right - 8, a.top + 14, 'right');
    put(L[2], a.left + 8, a.bottom - 8, 'left');
    put(L[3], a.right - 8, a.bottom - 8, 'right');
    ctx.font = '10px ' + FONT;
    put('risk-free ' + pct(rfRef), xp + 5, a.bottom - 24, 'left');
    ctx.restore();
  },
  afterDatasetsDraw(chart){
    const {ctx, chartArea: a} = chart, P = pal(), pts = [];
    chart.data.datasets.forEach((ds, i) => { const meta = chart.getDatasetMeta(i); if(meta.hidden) return;
      meta.data.forEach((pt, j) => pts.push({x: pt.x, y: pt.y, t: ds.data[j].t})); });
    // markers are obstacles too: a label never covers another company's point
    const placed = pts.map(p => ({x: p.x - 8, y: p.y - 8, w: 16, h: 16})).concat(chart.$saObs || []);
    const hit = box => placed.some(b => box.x < b.x + b.w && box.x + box.w > b.x && box.y < b.y + b.h && box.y + box.h > b.y);
    ctx.save(); ctx.font = '700 10px "SF Mono",Consolas,monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    // selected company first; a label with no free slot next to its point is skipped
    // (the point keeps its tooltip and the table lists every company)
    pts.sort((u, v) => (v.t === selected) - (u.t === selected)).forEach(p => {
      const w = ctx.measureText(p.t).width, cands = [];
      [0, -10, 10].forEach(off => { cands.push([p.x + 10, p.y + off]); cands.push([p.x - 10 - w, p.y + off]); });
      const best = cands.find(c => c[0] > a.left && c[0] + w < a.right && !hit({x: c[0] - 1, y: c[1] - 6, w: w + 2, h: 12}));
      if(!best) return;
      placed.push({x: best[0] - 1, y: best[1] - 6, w: w + 2, h: 12});
      ctx.fillStyle = p.t === selected ? P.gold : P.h;
      ctx.fillText(p.t, best[0], best[1]);
    });
    ctx.restore();
  }
};
function renderMap(){
  const cv = $('#sa-map'); if(!cv) return;
  const P = pal(), vis = mapVisible();
  const placed = vis.filter(r => isNum(r.implied_growth) && isNum(r.roic_share));
  const xs = placed.map(r => r.implied_growth).concat(isNum(rfRef) ? [rfRef] : []);
  const xmin = xs.length ? Math.floor((Math.min.apply(null, xs) - .01) * 100) / 100 : -.02;
  const xmax = xs.length ? Math.ceil((Math.max.apply(null, xs) + .015) * 100) / 100 : .15;
  const datasets = ['10-K', '20-F', 'ESEF'].map(k => {
    const pts = placed.filter(r => r.src_kind === k).map(r => ({x: r.implied_growth, y: r.roic_share, t: r.ticker}));
    const col = P[SLOT[k]];
    return {label: SRC_NAME[k], data: pts, pointStyle: SHAPE[k],
      pointRadius: pts.map(p => p.t === selected ? 9 : 6.5), pointHoverRadius: 9, pointHitRadius: 10,
      backgroundColor: pts.map(p => ROW[p.t].stale_financials ? P.card : col),
      borderColor: pts.map(p => ROW[p.t].stale_financials ? col : P.card),
      borderWidth: pts.map(p => ROW[p.t].stale_financials ? 2.2 : 1.5)};
  });
  if(mapChart) mapChart.destroy();
  mapChart = new Chart(cv, {
    type: 'scatter', data: {datasets},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: {padding: {top: 6, right: 8}},
      interaction: {mode: 'nearest', intersect: true},
      scales: {
        x: axis(P, {min: xmin, max: xmax, title: {display: true, text: 'Perpetual FCF growth implied by the price (reverse DCF)', color: P.muted},
          ticks: {color: P.muted, padding: 6, callback: v => Math.round(v * 100) + '%'}}),
        y: axis(P, {min: -.09, max: 1.2, title: {display: true, text: 'Years with ROIC above WACC', color: P.muted},
          afterBuildTicks: ax => { ax.ticks = [0, .25, .5, .75, 1].map(v => ({value: v})); },
          ticks: {color: P.muted, padding: 6, callback: v => Math.round(v * 100) + '%'}})
      },
      plugins: {
        legend: {display: false},
        tooltip: Object.assign(tip(P), {callbacks: {
          title: it => { const r = ROW[it[0].raw.t]; return r.name + ' (' + r.ticker + ')'; },
          label: it => { const r = ROW[it.raw.t]; return [
            'Implied growth  ' + pct(r.implied_growth),
            'ROIC > WACC  ' + r.roic_txt,
            'Sustainable growth  ' + pct(r.sgr),
            'Accounts  ' + SRC_NAME[r.src_kind] + ' · FY end ' + (r.fiscal_year_end || 'N/D') + (r.stale_financials ? ' (older than 15 months)' : '')]; },
          footer: () => 'Click to open the company file'}})
      },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick: (e, els) => { if(els.length){ const d = mapChart.data.datasets[els[0].datasetIndex].data[els[0].index]; openFile(d.t, true); } }
    },
    plugins: [quadPlugin]
  });
  const un = vis.filter(r => !(isNum(r.implied_growth) && isNum(r.roic_share)));
  $('#sa-unplaced').innerHTML = un.length
    ? '<strong>Not placed (N/D):</strong> ' + un.map(r => '<button class="sa-src" data-open="' + esc(r.ticker) + '">' + esc(r.ticker) + '</button>').join(', ') +
      ' — implied growth needs positive free cash flow and a known net debt; nothing is imputed.'
    : '';
}
$$('#sa-map-card .sa-chip[data-src]').forEach(b => b.addEventListener('click', () => {
  mapState.src = b.dataset.src;
  $$('#sa-map-card .sa-chip[data-src]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  renderMap();
}));
const hs = $('#sa-hide-stale'); if(hs) hs.addEventListener('change', () => { mapState.hideStale = hs.checked; renderMap(); });
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-open]'); if(b){ openFile(b.dataset.open, true); } });

/* coverage table (also the accessible table view of the map) */
const tblState = {k: 'implied_growth', dir: -1};
function renderTable(){
  const tb = $('#sa-tbl tbody'); if(!tb) return;
  const k = tblState.k, d = tblState.dir;
  const rows = ROWS.slice().sort((a, b) => {
    const va = a[k], vb = b[k];
    if(va == null && vb == null) return 0; if(va == null) return 1; if(vb == null) return -1;
    return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * d;
  });
  tb.innerHTML = rows.map(r => '<tr data-t="' + esc(r.ticker) + '"' + (r.ticker === selected ? ' class="sel"' : '') + ' tabindex="0">' +
    '<td><span class="sa-tk">' + esc(r.ticker) + '</span><span class="sa-co">' + esc(r.name) + '</span></td>' +
    '<td class="l">' + esc(r.sector) + '</td>' +
    '<td>' + H(pct(r.implied_growth)) + '</td>' +
    '<td>' + H(pct(r.sgr)) + '</td>' +
    '<td>' + H(r.roic_txt) + '</td>' +
    '<td>' + H(pctS(r.ecart_pct, 0)) + '</td>' +
    '<td>' + (r.n_flags ? '<span class="badge badge-gold">' + r.n_flags + '</span>' : '—') + '</td>' +
    '<td class="l">' + esc(SRC_NAME[r.src_kind]) + ' · ' + esc((r.fiscal_year_end || 'N/D').slice(0, 7)) +
      (r.stale_financials ? ' <span class="badge badge-red">old</span>' : '') + '</td></tr>').join('');
  $$('#sa-tbl th').forEach(th => th.setAttribute('aria-sort', th.dataset.k === k ? (d > 0 ? 'ascending' : 'descending') : 'none'));
}
$$('#sa-tbl th').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k; tblState.dir = tblState.k === k ? -tblState.dir : (k === 'ticker' || k === 'sector' || k === 'source' ? 1 : -1); tblState.k = k; renderTable();
}));
const tbody = $('#sa-tbl tbody');
if(tbody){
  tbody.addEventListener('click', e => { const tr = e.target.closest('tr[data-t]'); if(tr) openFile(tr.dataset.t, true); });
  tbody.addEventListener('keydown', e => { if(e.key === 'Enter'){ const tr = e.target.closest('tr[data-t]'); if(tr) openFile(tr.dataset.t, true); } });
}
getJSON('quality_report.json').then(q => {
  const s = q.summary || {}, b = $('#sa-quality-badge'); if(!b) return;
  b.textContent = (s.n_cross_checks || 0) + ' cross-checks · ' + (s.n_issues || 0) + ' gaps';
  b.className = 'badge ' + (s.n_issues ? 'badge-red' : 'badge-green');
  b.title = 'Weekly comparison of XBRL figures with a second source (quality_report.json)';
}).catch(() => {});

/* ═════════════ 2 + 3 · COMPANY FILE, SIMULATOR, SOURCES ═════════════ */
const FLAG_EN = {
  altman_distress: ['Altman Z-score in the distress zone', d => 'Z = ' + num(d.z, 2) + ', below 1.81.'],
  beneish_inconclusive: ['Earnings-manipulation screen inconclusive', d => 'Beneish M = ' + num(d.m, 2) + ' is above −1.78, but sales grew ×' + num(d.SGI, 2) + ' in a year: the model is not reliable in hyper-growth.'],
  corporate_action_after_filing: ['Corporate action after the last annual report', d => 'Share ratio ×' + num(d.ratio, 3) + ' on ' + esc((d.dates || []).join(', ')) + ', after the fiscal year ending ' + esc(d.fy_end) + '. The accounts describe the company before the event, so valuation is suspended.'],
  nt_filing: ['Late-filing notice', d => 'NT filing: ' + esc((d.details || []).map(x => x.form + ' ' + x.date).join(', ')) + '. The company could not file on time.'],
  restatement_2y: ['Restated accounts in the last two years', d => esc((d.details || []).map(x => x.form + ' ' + x.date).join(', ')) + '. Past figures were revised.'],
  goodwill_30pct: ['Goodwill above 30% of assets', d => 'Goodwill = ' + pct(d.goodwill_pct_assets, 0) + ' of total assets: growth bought through acquisitions.'],
  sbc_15pct_fcf: ['Stock-based pay above 15% of free cash flow', d => 'SBC = ' + pct(d.sbc_pct_fcf, 0) + ' of gross FCF. SAINHE deducts it from FCF before any valuation.'],
  transitory_items: ['Transitory items', () => 'One-off items were adjusted out of EBIT and net income.']
};
const SEV = {high: 'high', medium: 'medium', info: 'info', low: 'info'};
let fileTok = 0, sim = null, simChart = null, trendCharts = [], SPECS = {}, curRep = null;

function buildPicker(){
  const el = $('#sa-pick'); if(!el) return;
  el.innerHTML = ROWS.slice().sort((a, b) => a.ticker.localeCompare(b.ticker))
    .map(r => '<button class="sa-chip" data-pick="' + esc(r.ticker) + '" title="' + esc(r.name) + '">' + esc(r.ticker) + '</button>').join('');
  el.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if(b) openFile(b.dataset.pick, false); });
}
function openFile(t, scroll, quiet){
  if(!ROW[t]) return;
  selected = t;
  $$('#sa-pick .sa-chip').forEach(b => { const on = b.dataset.pick === t; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  renderTable(); renderMap();
  if(!quiet){ try{ history.replaceState(null, '', '#file=' + encodeURIComponent(t)); }catch(e){} }
  if(scroll){ const s = $('#sa-sec-file'); if(s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  const tok = ++fileTok;
  $('#sa-head').innerHTML = '<div class="sa-loading">Loading ' + esc(t) + '…</div>';
  report(t).then(rep => { if(tok === fileTok) renderFile(ROW[t], rep); })
    .catch(err => { if(tok === fileTok) $('#sa-head').innerHTML = '<div class="sa-loading">Report unavailable (' + esc(err.message) + ')</div>'; });
}
function cagr(obj, years){
  const s = series(obj); if(s.length < years + 1) return null;
  const a = s[s.length - 1 - years][1], b = s[s.length - 1][1];
  return a > 0 && b > 0 ? Math.pow(b / a, 1 / years) - 1 : null;
}
function renderFile(row, rep){
  curRep = rep;
  const A = rep.bloc_A_verdict || {}, meta = rep.meta || {}, wd = (rep.drill_down || {}).wacc_detail || {};
  const cur = meta.reporting_currency || row.currency || 'USD';
  const ig = isNum((A.reverse_dcf || {}).implied_g) ? A.reverse_dcf.implied_g : null;
  const rev5 = cagr((rep.bloc_D_trends || {}).revenue_10y, 5);
  const idx = (rep.drill_down || {}).edgar_filings_index;
  SPECS = buildSpecs(row, rep);
  let lede;
  if(isNum(ig)) lede = 'At <strong>' + esc(money(meta.price_in_reporting_currency, cur)) + '</strong>, the price implies free cash flow growing <strong>' +
      esc(pct(ig)) + '</strong> a year, forever, discounted at a <strong>' + esc(pct(wd.wacc)) + '</strong> cost of capital. ' +
      (isNum(rev5) ? 'Revenue grew ' + esc(pct(rev5)) + ' a year over the last five years' : 'Five-year revenue growth is N/D') +
      (isNum((A.SGR || {}).sgr) ? '; its sustainable growth rate (ROIC × reinvestment, last year) is ' + esc(pct(A.SGR.sgr)) + '.' : '.');
  else lede = 'Implied growth is <strong>N/D</strong> for this company: the reverse DCF needs positive adjusted free cash flow and a known net debt. ' +
      'The record below still applies; nothing is imputed.';
  const flags = (rep.bloc_B_flags || []).map(f => {
    const tr = FLAG_EN[f.id], d = f.details || {};
    const title = tr ? tr[0] : f.id.replace(/_/g, ' ');
    let body = ''; try{ body = tr ? tr[1](d) : ''; }catch(e){}
    return '<div class="sa-flag ' + (SEV[f.severity] || 'info') + '"><b>' + esc(f.severity || 'info') + '</b><span><strong>' + esc(title) + '.</strong> ' + body + '</span></div>';
  }).join('');
  const listing = meta.listing_currency && meta.listing_currency !== cur
    ? '<span class="badge badge-gold" title="Listing price converted to the currency of the accounts">listed in ' + esc(meta.listing_currency) + (meta.adr_ratio && meta.adr_ratio !== 1 ? ' · ADR ×' + num(meta.adr_ratio, 0) : '') + '</span>' : '';
  $('#sa-head').innerHTML =
    '<div class="sa-head"><div class="sa-name">' + esc(row.name) + '<small>' + esc(row.ticker) + ' · ' + esc(row.sector) + '</small></div>' +
    '<div class="sa-badges"><span class="badge badge-gold">' + esc(meta.source || row.source) + '</span>' +
    '<span class="badge ' + (meta.stale_financials ? 'badge-red' : 'badge-green') + '">FY end ' + esc(meta.fiscal_year_end || 'N/D') +
      (isNum(meta.months_since_fiscal_year_end) ? ' · ' + meta.months_since_fiscal_year_end + ' months ago' : '') + '</span>' + listing +
    (/^https:\/\//.test(idx || '') ? '<a class="sa-btn" href="' + esc(idx) + '" target="_blank" rel="noopener">All filings ↗</a>' : '') + '</div></div>' +
    '<p class="sa-lede" style="margin-top:12px">' + lede + '</p>' +
    (flags ? '<div class="sa-flags">' + flags + '</div>' : '<p class="sa-note" style="margin-top:10px">No accounting flag raised.</p>');
  renderFacts(row, rep, cur);
  initSim(rep, cur);
  renderTrends(rep, cur);
}

/* — source specs: formula + inputs + XBRL facts — */
function fact(rep, tag){ return ((rep.drill_down || {}).source_map_per_tag || {})[tag] || null; }
function buildSpecs(row, rep){
  const A = rep.bloc_A_verdict || {}, meta = rep.meta || {}, dd = rep.drill_down || {}, wd = dd.wacc_detail || {};
  const cur = meta.reporting_currency || 'USD', E = A.EPV || {}, ei = E.inputs || {}, R = (A.RE_valuation || {}), ri = R.inputs || {};
  const rd = A.reverse_dcf || {}, rdi = rd.inputs || {}, S = A.SGR || {}, H5 = rep.bloc_E_health || {}, C = A.consensus || {};
  const f = t => fact(rep, t);
  const adj = (dd.adjustments || {}).adjustments || [];
  const roicL = lastOf((rep.bloc_D_trends || {}).roic_10y), fcfL = lastOf((rep.bloc_D_trends || {}).fcf_adj_10y);
  const sh = f('shares_diluted') || f('shares_outstanding');
  return {
    price: {k: 'Market input', t: 'Share price', v: money(meta.price_in_reporting_currency, cur),
      formula: 'Daily close on ' + (rep.as_of || 'N/D') + ', converted to the currency of the accounts' + (meta.adr_ratio && meta.adr_ratio !== 1 ? '\nand to one ordinary share (ADR ratio ' + meta.adr_ratio + ')' : ''),
      inputs: [{l: 'Listing price', v: money(meta.price_listing, meta.listing_currency)},
               {l: 'FX listing → accounts', v: num(meta.fx_listing_to_reporting, 4)},
               {l: 'ADR ratio', v: num(meta.adr_ratio, 0)}],
      note: 'Source: Yahoo Finance daily close (free source). Not a filed figure.'},
    epv: {k: 'Computed', t: 'Earnings power value per share', v: money(E.epv_per_share, cur),
      formula: 'EPV = [EBIT_adj × (1 − t) / WACC − net debt] / diluted shares\nValue of today\'s earnings with zero growth (Greenwald).',
      inputs: [{l: 'Adjusted EBIT', v: big(ei.ebit_adj, cur), fact: f('ebit'), m: adj.length ? adj.length + ' adjustment(s) applied' : 'no adjustment'},
               {l: 'Effective tax rate t', v: pct(ei.tax), fact: f('tax_expense'), m: 'tax expense / pre-tax income'},
               {l: 'WACC', v: pct(ei.wacc), open: 'wacc'},
               {l: 'Net debt', v: big(ei.net_debt, cur), open: 'debt', m: 'debt + leases − cash − short-term investments'},
               {l: 'Diluted shares', v: big(sh && sh.value), fact: sh}]},
    re: {k: 'Computed', t: 'Residual-earnings value per share', v: money(R.re_value_per_share, cur),
      formula: 'V₀ = B₀ + Σ(t=1..5) RE / (1+ke)^t + [RE × (1+g) / (ke − g)] / (1+ke)^5\nRE = adjusted net income − ke × B₀ (held constant)',
      inputs: [{l: 'Book equity B₀', v: big(ri.B0, cur), fact: f('equity')},
               {l: 'Residual earnings RE', v: big(ri.RE, cur), fact: f('net_income')},
               {l: 'Cost of equity ke', v: pct(ri.ke), open: 'wacc'},
               {l: 'Terminal growth g', v: pct(ri.g), m: 'capped at min(risk-free, ke − 2 pts); sustainable growth was ' + pct(ri.g_sgr)}]},
    implied: {k: 'Computed', t: 'Implied perpetual growth (reverse DCF)', v: pct(rd.implied_g),
      formula: 'Solve EV = FCF × (1 + g) / (WACC − g)\n→ g = (WACC × EV − FCF) / (EV + FCF)\nEV = price × diluted shares + net debt',
      inputs: [{l: 'Enterprise value EV', v: big(rdi.ev, cur), open: 'price'},
               {l: 'Adjusted FCF', v: big(rdi.fcf_adj, cur), open: 'fcf'},
               {l: 'WACC', v: pct(rdi.wacc), open: 'wacc'}],
      note: rd.flag_unrealistic ? 'Flag: implied growth above 15% a year, forever.' : 'A growth rate, not a forecast: it is what the price already assumes.'},
    sgr: {k: 'Computed', t: 'Sustainable growth rate', v: pct(S.sgr),
      formula: 'SGR = ROIC × reinvestment rate\nreinvestment = (CapEx − D&A + ΔNWC) / NOPAT ; NWC = receivables + inventory − payables',
      inputs: [{l: 'ROIC', v: pct(S.roic), open: 'roic'},
               {l: 'Reinvestment rate', v: pct(S.rr)},
               {l: 'CapEx', v: big((f('capex') || {}).value, cur), fact: f('capex')},
               {l: 'D&A', v: big((f('dep_amort') || {}).value, cur), fact: f('dep_amort')}]},
    wacc: {k: 'Computed', t: 'Cost of capital (WACC)', v: pct(wd.wacc),
      formula: 'WACC = E/(D+E) × ke + D/(D+E) × kd × (1 − t)\nke = rf + β × ERP ; β adjusted (Blume) = 0.67 × β_raw + 0.33',
      inputs: [{l: 'Risk-free rf', v: pct(wd.rf, 2), m: wd.rf_source || ''},
               {l: 'β raw → adjusted', v: num(wd.beta_raw, 2) + ' → ' + num(wd.beta, 2), m: 'Yahoo Finance beta'},
               {l: 'Equity risk premium', v: pct(wd.erp)},
               {l: 'Cost of equity ke', v: pct(wd.ke)},
               {l: 'Cost of debt kd', v: pct(wd.kd), fact: f('interest_expense'), m: 'interest expense / debt'},
               {l: 'Market value of equity E', v: big(wd.E, cur), open: 'price'},
               {l: 'Debt D', v: big(wd.D, cur), fact: f('lt_debt')}],
      note: 'Mode: ' + (wd.mode || 'N/D') + '.'},
    roic: {k: 'Computed', t: 'Return on invested capital (latest)', v: roicL ? pct(roicL[1]) + ' (FY ' + roicL[0] + ')' : 'N/D',
      formula: 'ROIC = EBIT × (1 − t) / (book equity + net debt)',
      inputs: [{l: 'EBIT', v: big((f('ebit') || {}).value, cur), fact: f('ebit')},
               {l: 'Book equity', v: big((f('equity') || {}).value, cur), fact: f('equity')},
               {l: 'Years with ROIC > WACC', v: row.roic_txt}]},
    debt: {k: 'Computed', t: 'Net debt / EBITDA', v: isNum(H5.net_debt_ebitda) ? num(H5.net_debt_ebitda, 2) + '×' : 'N/D',
      formula: 'Net debt / (EBIT + D&A)\nInterest cover = EBIT / interest expense',
      inputs: [{l: 'Interest cover', v: isNum(H5.interest_coverage) ? num(H5.interest_coverage, 1) + '×' : 'N/D', fact: f('interest_expense')},
               {l: 'Cash', v: big((f('cash') || {}).value, cur), fact: f('cash')},
               {l: 'Long-term debt', v: big((f('lt_debt') || {}).value, cur), fact: f('lt_debt')},
               {l: 'D&A', v: big((f('dep_amort') || {}).value, cur), fact: f('dep_amort')}]},
    fcf: {k: 'Computed', t: 'Free cash flow, adjusted', v: fcfL ? big(fcfL[1], cur) + ' (FY ' + fcfL[0] + ')' : 'N/D',
      formula: 'FCF_adj = operating cash flow − capital expenditure − stock-based compensation\nSBC is a real cost paid in shares: SAINHE values on FCF after SBC only.',
      inputs: [{l: 'Operating cash flow', v: big((f('ocf') || {}).value, cur), fact: f('ocf')},
               {l: 'CapEx', v: big((f('capex') || {}).value, cur), fact: f('capex')},
               {l: 'Stock-based compensation', v: big((f('sbc') || {}).value, cur), fact: f('sbc')}]},
    revenue: {k: 'Filed figure', t: 'Revenue', v: big((f('revenue') || {}).value, cur), inputs: [{l: 'Revenue', v: big((f('revenue') || {}).value, cur), fact: f('revenue')}]},
    shares: {k: 'Filed figure', t: 'Diluted shares', v: big(sh && sh.value), inputs: [{l: 'Weighted diluted shares', v: big(sh && sh.value), fact: sh}]},
    consensus: {k: 'External context', t: 'Analyst price targets (median)', v: C.available ? money(C.target_median, meta.listing_currency) : 'N/D',
      formula: 'Median of published analyst targets, in the listing currency.\nShown as external context only: not a SAINHE estimate.',
      inputs: C.available ? [{l: 'Analysts', v: num(C.n_analysts)}, {l: 'Range', v: money(C.target_low, meta.listing_currency) + ' – ' + money(C.target_high, meta.listing_currency)},
                             {l: 'Dispersion (high − low) / median', v: pct(C.dispersion, 0)}] : [],
      note: 'Source: Yahoo Finance consensus. ' + (C.warning_few_analysts ? 'Few analysts: low reliability.' : '')}
  };
}

/* — simulator — */
function simInputs(rep){
  const A = rep.bloc_A_verdict || {}, dd = rep.drill_down || {}, wd = dd.wacc_detail || {}, meta = rep.meta || {};
  const rd = A.reverse_dcf || {}, rdi = rd.inputs || {}, ei = (A.EPV || {}).inputs || {};
  const price = isNum(meta.price_in_reporting_currency) ? meta.price_in_reporting_currency : (isNum(A.prix) ? A.prix : null);
  const sh = fact(rep, 'shares_diluted') || fact(rep, 'shares_outstanding');
  const shares = isNum(wd.E) && price ? wd.E / price : (sh && isNum(sh.value) ? sh.value : null);
  const nd = isNum(ei.net_debt) ? ei.net_debt : (isNum(rdi.ev) && isNum(wd.E) ? rdi.ev - wd.E : null);
  const fs = series((rep.bloc_D_trends || {}).fcf_adj_10y);
  const fcfLast = isNum(rdi.fcf_adj) ? rdi.fcf_adj : (fs.length ? fs[fs.length - 1][1] : null);
  const last5 = fs.slice(-5).map(x => x[1]);
  return {price, shares, nd, cur: meta.reporting_currency || 'USD',
    fcf: {last: fcfLast, med: last5.length >= 3 ? median(last5) : null}, n5: last5.length,
    wacc: isNum(wd.wacc) ? wd.wacc : rdi.wacc, sgr: (A.SGR || {}).sgr, rf: wd.rf,
    fy: fs.length ? fs[fs.length - 1][0] : null};
}
const simEV = S => S.price * S.shares + S.nd;
const simImplied = (S, fcf, w) => { const ev = simEV(S); return (w * ev - fcf) / (ev + fcf); };
const simValue = (S, g, w, fcf) => (fcf * (1 + g) / (w - g) - S.nd) / S.shares;
function initSim(rep, cur){
  const S = simInputs(rep), box = $('#sa-sim');
  const ok = isNum(S.price) && isNum(S.shares) && S.shares > 0 && isNum(S.nd) && isNum(S.wacc) && ((isNum(S.fcf.last) && S.fcf.last > 0) || (isNum(S.fcf.med) && S.fcf.med > 0));
  if(simChart){ simChart.destroy(); simChart = null; }
  if(!ok){
    sim = null;
    box.innerHTML = '<p class="sa-lede">The simulator needs a positive free cash flow, a known net debt and a share count.</p>' +
      '<p class="sa-note" style="margin-top:8px">For ' + esc(selected) + ' at least one of them is <span class="sa-nd">N/D</span> in the filings, so there is no implied growth to explore. SAINHE does not fill the gap with an estimate.</p>';
    return;
  }
  const basis = isNum(S.fcf.last) && S.fcf.last > 0 ? 'last' : 'med';
  sim = {S, basis, w: S.wacc, g: null};
  sim.g = simImplied(S, S.fcf[basis], sim.w);
  const fb = (b, l) => { const v = S.fcf[b]; const dis = !(isNum(v) && v > 0);
    return '<button data-b="' + b + '"' + (b === basis ? ' class="on"' : '') + (dis ? ' disabled title="N/D or not positive"' : '') + '>' + l + ' · ' + esc(big(v, cur)) + '</button>'; };
  box.innerHTML =
    '<div class="sa-sim-out">' +
      '<div><div class="sa-big-l">The price requires</div><div class="sa-big" id="sim-imp">—</div><div class="sa-tile-s">FCF growth a year, forever</div></div>' +
      '<div><div class="sa-big-l">You believe</div><div class="sa-big" id="sim-gb">—</div><div class="sa-tile-s" id="sim-gap">—</div></div>' +
      '<div><div class="sa-big-l">Arithmetic value at your inputs</div><div class="sa-big" id="sim-val">—</div><div class="sa-tile-s" id="sim-vs">—</div></div>' +
    '</div>' +
    '<div class="sa-ctl"><div class="sa-ctl-h"><label for="sim-g">Perpetual growth you believe</label><output id="sim-go" for="sim-g">—</output></div>' +
      '<input type="range" class="sa-range" id="sim-g" step="0.1"><div class="sa-pins" id="sim-pins" aria-hidden="true"></div></div>' +
    '<div class="sa-ctl"><div class="sa-ctl-h"><label for="sim-w">Discount rate (WACC)</label><output id="sim-wo" for="sim-w">—</output></div>' +
      '<input type="range" class="sa-range" id="sim-w" step="0.1"></div>' +
    '<div class="sa-ctl" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">' +
      '<span class="sa-seg" id="sim-basis" role="group" aria-label="Cash-flow base">' + fb('last', 'Last year') + fb('med', S.n5 + '-year median') + '</span>' +
      '<button class="sa-btn" id="sim-reset">Back to the price</button></div>' +
    '<div class="sa-curve"><canvas id="sim-curve" role="img" aria-label="Value per share for each growth rate at your discount rate, against the price"></canvas></div>' +
    '<p class="sa-note" style="margin-top:10px">The curve gives the value per share for every growth rate at your discount rate; it crosses the price at the implied growth. ' +
    '<strong>Not an estimate by SAINHE:</strong> arithmetic on your inputs (Gordon formula on adjusted FCF, ' + esc(S.fy ? 'FY ' + S.fy : '') + '). It explodes as growth nears the discount rate.</p>';
  const gR = $('#sim-g'), wR = $('#sim-w');
  wR.min = 3; wR.max = Math.max(16, Math.ceil(S.wacc * 100 + 3)); wR.value = (S.wacc * 100).toFixed(1);
  gR.addEventListener('input', () => { sim.g = +gR.value / 100; updateSim(); });
  wR.addEventListener('input', () => { sim.w = +wR.value / 100; updateSim(true); });
  $('#sim-basis').addEventListener('click', e => { const b = e.target.closest('button[data-b]'); if(!b || b.disabled) return;
    sim.basis = b.dataset.b; $$('#sim-basis button').forEach(x => x.classList.toggle('on', x === b)); updateSim(); });
  $('#sim-reset').addEventListener('click', () => { sim.w = S.wacc; wR.value = (S.wacc * 100).toFixed(1); sim.g = simImplied(S, S.fcf[sim.basis], sim.w); updateSim(true); });
  updateSim(true);
}
function updateSim(rescale){
  if(!sim) return;
  const S = sim.S, cur = S.cur, fcf = S.fcf[sim.basis], w = sim.w, gR = $('#sim-g');
  const gmin = -0.03, gmax = Math.round((w - 0.01) * 1000) / 1000;
  gR.min = (gmin * 100).toFixed(1); gR.max = (gmax * 100).toFixed(1);
  if(sim.g > gmax) sim.g = gmax; if(sim.g < gmin) sim.g = gmin;
  gR.value = (sim.g * 100).toFixed(1);
  const imp = simImplied(S, fcf, w), val = simValue(S, sim.g, w, fcf), gap = sim.g - imp;
  $('#sim-imp').textContent = pct(imp);
  $('#sim-gb').textContent = pct(sim.g);
  $('#sim-gap').textContent = Math.abs(gap) < 0.0005 ? 'exactly what the price requires' : pts(Math.abs(gap)).replace(/^[+±]/, '') + (gap > 0 ? ' above' : ' below') + ' what the price requires';
  $('#sim-val').textContent = money(val, cur);
  $('#sim-vs').textContent = (isNum(val) ? pctS(val / S.price - 1, 0) : 'N/D') + ' vs price ' + money(S.price, cur);
  $('#sim-go').textContent = pct(sim.g);
  $('#sim-wo').textContent = pct(w);
  const pins = [[imp, 'price', 'p-imp'], [S.sgr, 'SGR', ''], [S.rf, 'risk-free', '']];
  $('#sim-pins').innerHTML = pins.filter(p => isNum(p[0])).map(p => {
    const raw = (p[0] - gmin) / (gmax - gmin), out = raw > 1 ? ' →' : raw < 0 ? ' ←' : '';
    const left = Math.min(Math.max(raw, 0), 1) * 100;
    return '<span class="sa-pin ' + p[2] + '" style="left:' + left.toFixed(1) + '%;' + (left > 88 ? 'transform:translateX(-100%)' : left < 8 ? 'transform:none' : '') + '">' + p[1] + ' ' + pct(p[0]) + out + '</span>';
  }).join('');
  drawSimCurve(rescale);
}
function drawSimCurve(){
  const cv = $('#sim-curve'); if(!cv || !sim) return;
  const S = sim.S, P = pal(), fcf = S.fcf[sim.basis], w = sim.w;
  const gmin = -0.03, gmax = w - 0.01, xs = [], ys = [];
  for(let g = gmin; g <= gmax + 1e-9; g += 0.001){ xs.push(g); ys.push(simValue(S, g, w, fcf)); }
  const ymax = niceMax(Math.max(S.price * 2.6, simValue(S, sim.g, w, fcf) * 1.15));
  const ymin = ys[0] < 0 ? -niceMax(-ys[0]) : 0;
  const curve = xs.map((x, i) => ({x, y: ys[i]}));
  const ds = [
    {label: 'Value per share', data: curve, borderColor: P.s1, borderWidth: 2, pointRadius: 0, tension: 0, clip: 4},
    {label: 'Price', data: [{x: gmin, y: S.price}, {x: gmax, y: S.price}], borderColor: P.muted, borderWidth: 1.2, borderDash: [5, 4], pointRadius: 0},
    {label: 'Your belief', data: [{x: sim.g, y: simValue(S, sim.g, w, fcf)}], borderColor: P.card, backgroundColor: P.s1, borderWidth: 2, pointRadius: 6, pointHoverRadius: 7, showLine: false}
  ];
  if(simChart){
    simChart.data.datasets = ds;
    simChart.options.scales.x.min = gmin; simChart.options.scales.x.max = gmax;
    simChart.options.scales.y.min = ymin; simChart.options.scales.y.max = ymax;
    simChart.update('none'); return;
  }
  simChart = new Chart(cv, {type: 'line', data: {datasets: ds}, options: {
    responsive: true, maintainAspectRatio: false, animation: false, parsing: true,
    interaction: {mode: 'nearest', axis: 'x', intersect: false},
    scales: {
      x: axis(P, {type: 'linear', min: gmin, max: gmax, ticks: {color: P.muted, callback: v => (v * 100).toFixed(0) + '%'}, title: {display: true, text: 'Perpetual growth', color: P.muted}}),

let LAB = null;
const lab = {cur: 'USD', pts: {}, swap: {}, preset: 'equal'};
let growthChart = null, crisisChart = null, crisisSel = 'GFC_2008';
const CRISES = [['GFC_2008', 'Financial crisis 2008'], ['Taper_Tantrum_2013', 'Taper tantrum 2013'], ['Volmageddon_2018', 'Volmageddon 2018'],
                ['COVID_2020', 'Covid crash 2020'], ['Hike_Cycle_2022', 'Rate-hike cycle 2022']];
function decode(b){
  const r = {}; for(const t in b.r) r[t] = Float64Array.from(b.r[t], v => v == null ? NaN : v / 1e5);
  return {dates: b.dates, r, fx: b.fx_usd || {}, start: b.start, end: b.end, memo: {}};
}
function refSeries(B, t, cur, R){
  const key = t + '|' + R; if(B.memo[key]) return B.memo[key];
  const r = B.r[t]; if(!r) return null;
  const fc = cur === 'USD' ? null : B.fx[cur], fr = R === 'USD' ? null : B.fx[R];
  if((cur !== 'USD' && !fc) || (R !== 'USD' && !fr)) return null;
  const n = r.length, out = new Float64Array(n); out[0] = NaN;
  for(let i = 1; i < n; i++){
    if(!isFinite(r[i])){ out[i] = NaN; continue; }
    const x1 = (fc ? fc[i] : 1) / (fr ? fr[i] : 1), x0 = (fc ? fc[i - 1] : 1) / (fr ? fr[i - 1] : 1);
    out[i] = (1 + r[i]) * (x1 / x0) - 1;
  }
  return (B.memo[key] = out);
}
function positions(){   // current rows → [{t, cur, name, sector, base, w}]
  const tot = LAB.holdings.reduce((s, h) => s + (lab.pts[h.t] || 0), 0) || 1;
  return LAB.holdings.map(h => {
    const c = lab.swap[h.t] && LAB.competitors[h.t];
    return {t: c ? c.t : h.t, cur: (c ? c.cur : h.cur) || 'USD', name: c ? c.name : h.name, sector: h.sector, base: h.t, w: (lab.pts[h.t] || 0) / tot};
  });
}
function portfolio(B, pos, R, local){
  const n = B.dates.length, p = new Float64Array(n), ser = pos.map(q => local ? (B.r[q.t] || null) : refSeries(B, q.t, q.cur, R));
  for(let i = 1; i < n; i++){
    let s = 0, ws = 0;
    for(let k = 0; k < pos.length; k++){ const v = ser[k] ? ser[k][i] : NaN; if(pos[k].w > 0 && isFinite(v)){ s += pos[k].w * v; ws += pos[k].w; } }
    p[i] = ws > 0 ? s / ws : 0;
  }
  return {p, ser};
}
function stats(B, p, b){
  let cum = 1, peak = 1, mdd = 0; const arr = [], path = [100];
  for(let i = 1; i < p.length; i++){ cum *= 1 + p[i]; if(cum > peak) peak = cum; mdd = Math.min(mdd, cum / peak - 1); arr.push(p[i]); path.push(cum * 100); }
  const yrs = (new Date(B.dates[B.dates.length - 1]) - new Date(B.dates[0])) / (365.25 * 864e5);
  const m = avg(arr), sd = Math.sqrt(avg(arr.map(v => (v - m) * (v - m))));
  const s = arr.slice().sort((x, y) => x - y), k = Math.max(0, Math.floor(0.05 * s.length) - 1);
  let beta = null;
  if(b){ const xs = [], ys = []; for(let i = 1; i < p.length; i++) if(isFinite(b[i])){ xs.push(b[i]); ys.push(p[i]); }
    const mx = avg(xs), my = avg(ys); let cv = 0, vx = 0; for(let i = 0; i < xs.length; i++){ cv += (xs[i] - mx) * (ys[i] - my); vx += (xs[i] - mx) * (xs[i] - mx); }
    beta = vx > 0 ? cv / vx : null; }
  return {total: cum - 1, cagr: yrs > 0 ? Math.pow(cum, 1 / yrs) - 1 : null, vol: sd * Math.sqrt(252), mdd,
    var95: -s[k], cvar95: -avg(s.slice(0, k + 1)), beta, path};
}
function riskContrib(pos, ser, p){
  const n = p.length, mp = avg(Array.from(p).slice(1)); let vp = 0; for(let i = 1; i < n; i++) vp += (p[i] - mp) * (p[i] - mp);
  return pos.map((q, k) => { const r = ser[k]; if(!r || !(q.w > 0) || vp <= 0) return 0;
    let c = 0; for(let i = 1; i < n; i++){ const v = isFinite(r[i]) ? r[i] : 0; c += v * (p[i] - mp); }
    return q.w * c / vp; });
}
function benchSeries(B, R){ return refSeries(B, B.r.ACWI ? 'ACWI' : 'SPY', 'USD', R); }

function presetWeights(name){

function crisisRun(B, pos, R){
  const n = B.dates.length;
  const avail = pos.map(q => { const r = B.r[q.t]; if(!r) return false; let k = 0; for(let i = 1; i < n; i++) if(isFinite(r[i])) k++; return k >= 0.9 * (n - 1); });
  const inc = pos.filter((q, k) => avail[k] && q.w > 0), wtot = pos.reduce((s, q) => s + q.w, 0) || 1;
  const covW = inc.reduce((s, q) => s + q.w, 0) / wtot;
  const a = portfolio(B, inc, R), eqList = pos.filter((q, k) => avail[k]);
  const e = portfolio(B, eqList.map(q => Object.assign({}, q, {w: 1})), R);
  const bench = benchSeries(B, R), bp = new Float64Array(n); for(let i = 1; i < n; i++) bp[i] = bench && isFinite(bench[i]) ? bench[i] : 0;
  return {a: stats(B, a.p, null), e: stats(B, e.p, null), b: stats(B, bp, null), nInc: inc.length, nPos: pos.filter(q => q.w > 0).length, covW,
    missing: pos.filter((q, k) => !avail[k] && q.w > 0).map(q => q.t)};
}
function renderCrisis(){
  if(!LAB) return;
  const pos = positions(), R = lab.cur, P = pal(), tb = $('#sa-crisis-tbl tbody');
  const res = {};
  CRISES.forEach(([k]) => { if(LAB.C[k]) res[k] = crisisRun(LAB.C[k], pos, R); });
  tb.innerHTML = CRISES.filter(([k]) => res[k]).map(([k, l]) => { const r = res[k], B = LAB.C[k];
    return '<tr data-c="' + k + '"' + (k === crisisSel ? ' class="sel"' : '') + ' tabindex="0"><td class="l">' + esc(l) + '</td><td>' + esc(B.start) + ' → ' + esc(B.end) + '</td>' +
      '<td>' + H(pctS(r.a.total)) + '</td><td>' + H(pct(r.a.mdd)) + '</td><td>' + H(pctS(r.e.total)) + '</td><td>' + H(pctS(r.b.total)) + '</td>' +
      '<td class="l" title="' + esc(r.missing.length ? 'Not listed then: ' + r.missing.join(', ') : 'All holdings listed') + '">' + r.nInc + '/' + r.nPos + ' holdings · ' + pct(r.covW, 0) + ' of weight' +
      (r.missing.length ? ' <span class="sa-co">missing ' + esc(r.missing.slice(0, 4).join(', ')) + (r.missing.length > 4 ? '…' : '') + '</span>' : '') + '</td></tr>'; }).join('');
  const pick = $('#sa-crisis-pick');
  pick.innerHTML = '<span class="sa-kicker">Replay</span>' + CRISES.filter(([k]) => res[k]).map(([k, l]) => '<button class="sa-chip' + (k === crisisSel ? ' on' : '') + '" data-c="' + k + '" aria-pressed="' + (k === crisisSel) + '">' + esc(l) + '</button>').join('') +
    '<span class="sa-sep" aria-hidden="true"></span><span class="sa-note">measured in ' + esc(R) + ' · window starts one week before the shock</span>';
  const B = LAB.C[crisisSel], r = res[crisisSel]; if(!B || !r) return;
  const ds = [{label: 'Your allocation', data: r.a.path, borderColor: P.s1, backgroundColor: P.s1, borderWidth: 2.2, pointRadius: 0, tension: 0},
              {label: 'Equal weight', data: r.e.path, borderColor: P.s3, backgroundColor: P.s3, borderWidth: 1.6, pointRadius: 0, tension: 0},
              {label: 'MSCI ACWI (ETF)', data: r.b.path, borderColor: P.s2, backgroundColor: P.s2, borderWidth: 1.6, pointRadius: 0, tension: 0}];
  if(crisisChart){ crisisChart.data.labels = B.dates; crisisChart.data.datasets = ds; crisisChart.update('none'); }
  else { crisisChart = lineChart($('#sa-crisis'), B.dates, ds, R); crisisChart.options.scales.x.ticks.callback = function(v){ return String(this.getLabelForValue(v)).slice(0, 10); }; crisisChart.update('none'); }
}
$('#sa-crisis-pick').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(b){ crisisSel = b.dataset.c; renderCrisis(); } });
$('#sa-crisis-tbl tbody').addEventListener('click', e => { const tr = e.target.closest('tr[data-c]'); if(tr){ crisisSel = tr.dataset.c; renderCrisis(); } });

const first = hf && ROW[decodeURIComponent(hf[1])] ? decodeURIComponent(hf[1]) : (ROW.NVDA ? 'NVDA' : (ROWS[0] || {}).ticker);

if(hf){ const s = $('#sa-sec-file'); if(s) setTimeout(() => s.scrollIntoView({block: 'start'}), 50); }

getJSON('lab_data.json').then(d => {
  LAB = d; LAB.M = decode(d.main); LAB.C = {};
  Object.keys(d.crises || {}).forEach(k => { LAB.C[k] = decode(d.crises[k]); });
  lab.cur = LAB.currencies_display.indexOf(window.SAINHE_CUR) >= 0 ? window.SAINHE_CUR : 'USD';

  if(!fromHash) presetWeights('equal');
  else $$('#sa-lab-card .sa-chip[data-preset]').forEach(b => b.classList.remove('on'));

  if(fromHash && window._sainheSetCurrency && window.SAINHE_CUR !== lab.cur) window._sainheSetCurrency(lab.cur);
  if(fromHash){ const s = $('#sa-sec-lab'); if(s) setTimeout(() => s.scrollIntoView({block: 'start'}), 50); }
}).catch(err => {
  const m = '<div class="sa-loading">Lab data unavailable (' + esc(err.message) + ').</div>';
  $('#sa-lab').innerHTML = m; const t = $('#sa-crisis-tbl tbody'); if(t) t.innerHTML = '<tr><td colspan="7" class="l">' + m + '</td></tr>';
});
})();
