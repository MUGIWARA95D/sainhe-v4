<script>
/* ══════ STOCK ANALYSIS — phase 1 ═════════════════════════════════════════
 * 1. Quality × Price map      (valuation map, embedded)
 * 2. "What you have to believe" simulator  (reverse DCF on the user's inputs)
 * 3. Every number → its source (drawer: formula, inputs, XBRL tag, filing link)
 * 4. Allocation Lab           (weights, rival swap, currency lens — lab_data.json)
 * 5. Crisis replay            (the Lab allocation through 5 stress windows)
 * Zero prediction: everything is arithmetic on filed numbers or past prices.
 * ═════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
if(!window.Chart || !window.SACALC) return;
/* one generation per visit: after a swipe rebuilds the page, listeners of the previous visit
   (still attached to document/window) stand down instead of acting on the new page */
const GEN = window._saGen = (window._saGen || 0) + 1;
const onDoc = (type, fn, opt) => document.addEventListener(type, e => { if(GEN === window._saGen) fn(e); }, opt);
const onWin = (type, fn, opt) => window.addEventListener(type, e => { if(GEN === window._saGen) fn(e); }, opt);
{ const old = document.getElementById('sa-tt'); if(old) old.remove(); }
/* the audit drawer lives on <body>, not in <main>: #main is its own stacking layer (z-index 1),
   so inside it the drawer stayed under the site header whatever its z-index (the ✕ sat under "Menu").
   A previous visit's copy is dropped first; the swipe engine also removes it when leaving the page. */
{ const fresh = document.querySelector('#main #sa-drawer');
  if(fresh){ document.querySelectorAll('body > [data-sa-portal]').forEach(x => x.remove());
    [document.getElementById('sa-drawer-scrim'), fresh].forEach(x => { if(x){ x.setAttribute('data-sa-portal', ''); document.body.appendChild(x); } }); } }
const {derive, simImplied, simValue, impliedAt, fadeValue, fadeImplied, fxRate, decode, refSeries, portfolio, stats, riskContrib, bootstrap, tailFor, turbulence, quantile, aligned, moments, optimize, evaluate} = window.SACALC;
const VM = JSON.parse((document.getElementById('sa-vmap')||{}).textContent || '{}') || {};
const ROWS = (VM.rows || []).slice();
const BASE = '/data/stock/';
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const isNum = v => typeof v === 'number' && isFinite(v);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NDH = '<span class="sa-nd">N/D</span>';
const H = t => t === 'N/D' ? NDH : esc(t);               // plain text → safe HTML (N/D greyed)
const pct = (v, d) => { if(!isNum(v)) return 'N/D'; const s = Math.abs(v * 100).toFixed(d == null ? 1 : d); return (v < 0 && +s !== 0 ? '−' : '') + s + '%'; };
function signed(v, d, unit){ if(!isNum(v)) return 'N/D'; const s = Math.abs(v * 100).toFixed(d == null ? 1 : d); return (+s === 0 ? '±' : v > 0 ? '+' : '−') + s + unit; }
const pctS = (v, d) => signed(v, d, '%');
const pts = (v, d) => signed(v, d, ' pts');
function niceMax(v){ if(!(v > 0)) return 1; const m = Math.pow(10, Math.floor(Math.log10(v))) / 2; return Math.ceil(v / m) * m; }
const num = (v, d) => isNum(v) ? v.toLocaleString('en-US', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}).replace(/^-/, '−') : 'N/D';
function big(v, cur){
  if(!isNum(v)) return 'N/D';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  let s;
  if(a >= 1e12) s = (a / 1e12).toFixed(2) + ' tn';
  else if(a >= 1e9) s = (a / 1e9).toFixed(1) + ' bn';
  else if(a >= 1e6) s = (a / 1e6).toFixed(1) + ' m';
  else s = a.toLocaleString('en-US', {maximumFractionDigits: 2});
  return (cur ? cur + ' ' : '') + sg + s;
}
const money = (v, cur) => isNum(v) ? (cur ? cur + ' ' : '') + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/D';
function median(a){ const s = a.filter(isNum).sort((x, y) => x - y); if(!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
function series(obj){ return Object.keys(obj || {}).filter(k => isNum(obj[k])).sort().map(k => [k, obj[k]]); }
function lastOf(obj){ const s = series(obj); return s.length ? s[s.length - 1] : null; }

/* ── theme-aware colours (series palette validated, see _sa_style.html) ── */
function cssv(n, el){ return getComputedStyle(el || document.documentElement).getPropertyValue(n).trim(); }
function pal(){
  const sa = $('.sa');
  return {s1: cssv('--s1', sa), s2: cssv('--s2', sa), s3: cssv('--s3', sa),
    h: cssv('--h'), p: cssv('--p'), muted: cssv('--muted'), faint: cssv('--faint'), grid: cssv('--border-lt'),
    border: cssv('--border'), card: cssv('--card'), goldBg: cssv('--gold-bg'), gold: cssv('--gold')};
}
const FONT = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.family = FONT;
Chart.defaults.font.size = 11;
const restyle = [];
new MutationObserver(() => restyle.forEach(f => { try{ f(); }catch(e){ console.error(e); } }))
  .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
function axis(P, extra){
  return Object.assign({grid: {color: P.grid, drawTicks: false}, border: {display: false},
    ticks: {color: P.muted, padding: 6}}, extra || {});
}
function tip(P){
  return {backgroundColor: P.card, titleColor: P.h, bodyColor: P.p, borderColor: P.border, borderWidth: 1,
    padding: 10, cornerRadius: 8, displayColors: true, boxPadding: 4, usePointStyle: true};
}

/* ── data ── */
const cache = {};
function getJSON(name){
  if(!cache[name]) cache[name] = fetch(BASE + name).then(r => { if(!r.ok) throw new Error(name + ' HTTP ' + r.status); return r.json(); });
  return cache[name];
}
const report = t => getJSON(encodeURIComponent(t) + '_report.json');

ROWS.forEach(r => {
  const m = /^(\d+)\s*\/\s*(\d+)$/.exec(String(r.roic_years_above_wacc || ''));
  r.roic_share = m && +m[2] > 0 ? (+m[1]) / (+m[2]) : null;
  r.roic_txt = m ? m[1] + '/' + m[2] + ' yrs' : 'N/D';
  r.src_kind = /Yahoo/.test(r.source || '') ? 'YF' : /20-F/.test(r.source || '') ? '20-F' : /ESEF/.test(r.source || '') ? 'ESEF' : '10-K';
  ['implied_growth', 'sgr', 'ecart_pct', 'prix', 'epv_per_share', 're_per_share', 'rf'].forEach(k => { if(!isNum(r[k])) r[k] = null; });
});
const ROW = {}; ROWS.forEach(r => { ROW[r.ticker] = r; });
const SRC_NAME = {'10-K': 'US 10-K', '20-F': 'Foreign 20-F', 'ESEF': 'Europe ESEF', 'YF': 'Yahoo (secondary)'};
const asOf = $('#sa-asof'); if(asOf && VM.as_of) asOf.textContent = 'as of ' + VM.as_of;

/* ═════════════ 1 · QUALITY × PRICE — map + table, one shared state ═════════════
 * hover  : transient highlight, table row ↔ point (both directions)
 * brush  : Set of tickers drawn as a rectangle on the map — filters the table
 * compare: up to 4 tickers side by side, kept while filtering
 * dW     : WACC shift applied to every company (−2..+2 pts), base case drawn in outline
 * `selected` (the company in focus) drives the audit drawer and section 02.
 * Every figure comes from valuation_map.json; recomputations are arithmetic only. */
const TH = VM.thresholds || {};
const st = {hover: null, brush: null, compare: [], dW: 0, src: 'all', hideStale: false, sort: {k: 'gap', dir: -1}, xmode: 'nominal', ymode: 'share', cmpMode: false};
let mapChart = null, selected = null, drag = null, noClick = false, xRange = null, yRange = null;
/* vertical axis: 'share' = share of fiscal years with ROIC above WACC (default) ;
 * 'spread' = median ROIC − WACC over the same years, in points — spreads apart companies that
 * all sit at 100% (a 4/4 record and a 10/10 record are not the same proof) */
const yOf = d => st.ymode === 'spread' ? d.spread : d.share;
const Y_LINE = () => st.ymode === 'spread' ? 0 : 0.5;            // quadrant boundary
const markerR = n => 3.2 + 0.5 * Math.min(Math.max(n || 0, 1), 10);   // marker size ∝ fiscal years measured
const SHAPE = {'10-K': 'circle', '20-F': 'triangle', 'ESEF': 'rectRot', 'YF': 'rect'};
// secondary source: neutral ink, not a fourth categorical hue (the validated palette has three)
const SLOT = {'10-K': 's1', '20-F': 's2', 'ESEF': 's3', 'YF': 'muted'};
const icTxt = isNum(TH.ic_nm_min_share_of_assets) ? pct(TH.ic_nm_min_share_of_assets, 0) : 'the published share';
const NM_TXT = {
  negative_net_reinvestment: 'n/m — net reinvestment is negative (capex below depreciation and/or working capital released): growth is not funded by reinvestment.',
  reinvestment_exceeds_nopat: 'n/m — reinvestment exceeds after-tax operating profit: growth is funded from outside, not self-sustained.',
  invested_capital_near_zero: 'n/m — invested capital is below ' + icTxt + ' of total assets: the ROIC denominator is close to zero, so ROIC and sustainable growth are artefacts.'
};
function alpha(c, a){
  const m = /^#([0-9a-f]{6})$/i.exec(String(c).trim()); if(!m || a >= 1) return c;
  const n = parseInt(m[1], 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
const filtered = () => ROWS.filter(r => (st.src === 'all' || r.src_kind === st.src) && !(st.hideStale && r.stale_financials));
function rfLines(rows){
  const m = {};
  rows.forEach(r => { if(!isNum(r.rf)) return; const k = r.rf.toFixed(4);
    const l = (m[k] = m[k] || {rf: r.rf, cur: new Set(), proxy: new Set()}); l[r.rf_proxy ? 'proxy' : 'cur'].add(r.rf_currency); });
  return Object.keys(m).map(k => m[k]).sort((a, b) => a.rf - b.rf);
}
function computeXRange(rows){
  const xs = [];   // fixed over the whole slider range: points move, the axis does not
  rows.forEach(r => [-0.02, 0, 0.02].forEach(d => { const x = xOf(r, derive(r, d).g); if(isNum(x)) xs.push(x); }));
  if(st.xmode === 'excess') xs.push(0); else rfLines(rows).forEach(l => xs.push(l.rf));
  if(!xs.length) return [-0.02, 0.15];
  return [Math.floor((Math.min.apply(null, xs) - .01) * 100) / 100, Math.ceil((Math.max.apply(null, xs) + .01) * 100) / 100];
}
/* vertical range on the companies shown (filters rescale it), fixed over the WACC slider */
function computeYRange(rows){
  const ys = [];
  rows.forEach(r => [-0.02, 0, 0.02].forEach(d => { const v = yOf(derive(r, d)); if(isNum(v)) ys.push(v); }));
  if(!ys.length) return st.ymode === 'spread' ? [-0.1, 0.3] : [-0.09, 1.12];
  let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  const pad = Math.max(st.ymode === 'spread' ? 0.03 : 0.08, (hi - lo) * 0.12);
  lo -= pad; hi += pad * 1.6;                                     // headroom for the quadrant labels
  if(st.ymode === 'share'){ lo = Math.max(lo, -0.09); hi = Math.min(hi, 1.14); }
  return [lo, hi];
}

/* — map: quadrant labels, risk-free lines, base-case links, ticker labels, brush rectangle — */
const s1Plugin = {
  id: 'saS1',
  beforeDatasetsDraw(chart, args, opts){
    const {ctx, chartArea: a, scales: {x, y}} = chart, P = pal(), narrow = a.right - a.left < 520;
    const obs = chart.$saObs = [];
    const put = (txt, px, py, align) => { const w = ctx.measureText(txt).width;
      let x0 = align === 'right' ? px - w : px;
      if(align !== 'right' && x0 + w > a.right - 4) x0 = px - 8 - w;
      x0 = Math.max(a.left + 4, Math.min(x0, a.right - 4 - w));
      ctx.textAlign = 'left'; ctx.fillText(txt, x0, py); obs.push({x: x0 - 2, y: py - 10, w: w + 4, h: 13}); };
    ctx.save();
    const yp = y.getPixelForValue(Y_LINE()), lineIn = yp >= a.top && yp <= a.bottom;
    ctx.strokeStyle = P.border; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
    if(lineIn){ ctx.beginPath(); ctx.moveTo(a.left, yp); ctx.lineTo(a.right, yp); ctx.stroke(); }
    // risk-free: one thin dashed line per rate, named in the band above the plot ("EUR 3.44%");
    // currencies with no free 10-year yield sit on the US line and are listed after it (proxy)
    ctx.strokeStyle = alpha(P.muted, .7); ctx.setLineDash([5, 4]);
    const rfLbl = [];
    (opts.rf || []).forEach(l => {
      const xp = x.getPixelForValue(l.rf); if(xp < a.left || xp > a.right) return;
      ctx.beginPath(); ctx.moveTo(xp, a.top); ctx.lineTo(xp, a.bottom); ctx.stroke();
      const cur = Array.from(l.cur).join(' · '), px = Array.from(l.proxy);
      rfLbl.push({xp, txt: (cur || px.join(' · ')) + ' ' + (st.xmode === 'excess' ? '' : pct(l.rf, narrow ? 1 : 2)),
        sub: cur && px.length ? (narrow ? '+' + px.length + ' proxy' : '+ ' + px.join(', ') + ' (proxy)') : ''});
    });
    ctx.setLineDash([]); ctx.font = '600 9.5px ' + FONT; ctx.textBaseline = 'alphabetic';
    const rows_ = [[], [], []];   // up to three rows when labels would touch
    rfLbl.forEach(L => {
      const full = L.txt.trim() + (L.sub ? '  ' + L.sub : ''), w = ctx.measureText(full).width;
      const x0 = Math.max(a.left, Math.min(L.xp - w / 2, a.right - w));
      let r = rows_.findIndex(row => !row.some(o => x0 < o[1] + 8 && x0 + w > o[0] - 8)); if(r < 0) r = rows_.length - 1;
      rows_[r].push([x0, x0 + w]);
      const yy = a.top - 6 - r * 13;
      ctx.fillStyle = P.muted; ctx.textAlign = 'left'; ctx.fillText(L.txt.trim(), x0, yy);
      if(L.sub){ const w1 = ctx.measureText(L.txt.trim() + '  ').width; ctx.fillStyle = alpha(P.muted, .65); ctx.fillText(L.sub, x0 + w1, yy); }
      ctx.strokeStyle = alpha(P.muted, .5); ctx.beginPath(); ctx.moveTo(L.xp, yy + 2); ctx.lineTo(L.xp, a.top); ctx.stroke();
    });
    ctx.setLineDash([]); ctx.font = '600 9.5px ' + FONT; ctx.fillStyle = P.muted;
    const sp = st.ymode === 'spread';
    const up = narrow ? (sp ? 'ROIC > WACC' : 'PROVEN') : (sp ? 'ROIC ABOVE WACC' : 'PROVEN RETURNS'),
          dn = narrow ? (sp ? 'ROIC < WACC' : 'UNPROVEN') : (sp ? 'ROIC BELOW WACC' : 'UNPROVEN RETURNS'),
          lo_ = narrow ? 'MODEST' : 'MODEST EXPECTATIONS', hi_ = narrow ? 'DEMANDING' : 'DEMANDING EXPECTATIONS';
    // label only the halves that are on screen: a filtered view may show one side of the boundary
    if(yp > a.top + 20){ put(up + ' · ' + lo_, a.left + 8, a.top + 14, 'left'); put(up + ' · ' + hi_, a.right - 8, a.top + 14, 'right'); }
    if(yp < a.bottom - 20){ put(dn + ' · ' + lo_, a.left + 8, a.bottom - 8, 'left'); put(dn + ' · ' + hi_, a.right - 8, a.bottom - 8, 'right'); }
    ctx.restore();
  },
  afterDatasetsDraw(chart){
    const {ctx, chartArea: a} = chart, P = pal(), cur = [], ghost = {};
    chart.data.datasets.forEach((ds, i) => { const meta = chart.getDatasetMeta(i); if(meta.hidden) return;
      meta.data.forEach((pt, j) => { const t = ds.data[j].t; if(ds.kind === 'ghost') ghost[t] = pt; else cur.push({x: pt.x, y: pt.y, t}); }); });
    ctx.save();
    ctx.strokeStyle = alpha(P.muted, .7); ctx.lineWidth = 1;
    cur.forEach(p => { const g = ghost[p.t]; if(g && Math.hypot(g.x - p.x, g.y - p.y) > 3){ ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(p.x, p.y); ctx.stroke(); } });
    const placed = cur.map(p => ({x: p.x - 8, y: p.y - 8, w: 16, h: 16})).concat(chart.$saObs || []);
    const hit = b => placed.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
    ctx.font = '700 10px "SF Mono",Consolas,monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const rank = t => (t === st.hover ? 2 : 0) + (t === selected ? 1 : 0);
    cur.sort((u, v) => rank(v.t) - rank(u.t)).forEach(p => {
      const w = ctx.measureText(p.t).width, cands = [];
      [0, -10, 10].forEach(off => { cands.push([p.x + 10, p.y + off]); cands.push([p.x - 10 - w, p.y + off]); });
      const best = cands.find(c => c[0] > a.left && c[0] + w < a.right && !hit({x: c[0] - 1, y: c[1] - 6, w: w + 2, h: 12}));
      if(!best) return;
      placed.push({x: best[0] - 1, y: best[1] - 6, w: w + 2, h: 12});
      const dim = st.brush && !st.brush.has(p.t);
      ctx.fillStyle = rank(p.t) ? P.gold : (dim ? alpha(P.h, .3) : P.h);
      ctx.fillText(p.t, best[0], best[1]);
    });
    ctx.restore();
  },
  afterDraw(chart){
    if(!drag || !drag.on) return;
    const {ctx} = chart, P = pal(), x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
    ctx.save(); ctx.fillStyle = alpha(P.s2, .08); ctx.strokeStyle = P.s2; ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
    ctx.fillRect(x, y, Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0));
    ctx.strokeRect(x, y, Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0)); ctx.restore();
  }
};
/* x-axis mode: 'nominal' (default) or 'excess' = implied growth − risk-free of the company's own currency.
 * The risk-free rate embeds that currency's expected inflation, so the excess is comparable across
 * currencies without an inflation series (which no free source publishes for most of them). */
const xOf = (r, g) => st.xmode === 'excess' ? (isNum(g) && isNum(r.rf) ? g - r.rf : null) : g;
function mapDatasets(rows){
  const P = pal(), out = [];
  const dim = t => st.brush && !st.brush.has(t), hot = t => t === st.hover || t === selected;
  ['10-K', '20-F', 'ESEF', 'YF'].forEach(k => {
    const col = P[SLOT[k]], set = rows.filter(r => r.src_kind === k);
    const pt = (r, dW) => { const d = derive(r, dW), x = xOf(r, d.g), y = yOf(d); return isNum(x) && isNum(y) ? {x, y, t: r.ticker, n: d.n} : null; };
    const cur = set.map(r => pt(r, st.dW)).filter(Boolean);
    out.push({label: SRC_NAME[k], kind: 'cur', data: cur, pointStyle: SHAPE[k], order: 1,
      pointRadius: cur.map(p => markerR(p.n) + (p.t === st.hover ? 3 : p.t === selected ? 2 : 0)), pointHoverRadius: cur.map(p => markerR(p.n) + 3), pointHitRadius: 10,
      backgroundColor: cur.map(p => alpha(ROW[p.t].stale_financials ? P.card : col, dim(p.t) ? .2 : 1)),
      borderColor: cur.map(p => hot(p.t) ? P.h : (ROW[p.t].stale_financials ? alpha(col, dim(p.t) ? .3 : 1) : P.card)),
      borderWidth: cur.map(p => hot(p.t) ? 2.5 : (ROW[p.t].stale_financials ? 2.2 : 1.5))});
    if(st.dW !== 0){
      const base = set.map(r => pt(r, 0)).filter(Boolean);
      out.push({label: SRC_NAME[k] + ' · base case', kind: 'ghost', data: base, pointStyle: SHAPE[k], order: 2,
        pointRadius: base.map(p => markerR(p.n)), pointHoverRadius: base.map(p => markerR(p.n)), pointHitRadius: 0, backgroundColor: 'rgba(0,0,0,0)', borderColor: alpha(col, .5), borderWidth: 1.5});
    }
  });
  return out;
}
function renderMap(rebuild){
  const cv = $('#sa-map'); if(!cv) return;
  const rows = filtered(), P = pal();
  if(rebuild || !xRange){ xRange = computeXRange(rows); yRange = computeYRange(rows); }
  const ds = mapDatasets(rows), lines = st.xmode === 'excess' ? [{rf: 0, cur: new Set(['own currency']), proxy: new Set()}] : rfLines(rows);
  // two-level axis titles in HTML (plain question above, technical term below)
  const xs = $('#sa-xsub'), ys = $('#sa-ysub');
  if(xs) xs.textContent = (st.xmode === 'excess' ? 'implied growth minus the risk-free rate of each company\'s currency' : 'perpetual FCF growth implied by the price (reverse DCF)') +
    (st.dW ? ' — WACC ' + signed(st.dW, 2, ' pt') : '');
  if(ys) ys.textContent = st.ymode === 'spread' ? 'median ROIC − WACC spread, in points' : 'years with ROIC above WACC';
  cv.setAttribute('aria-label', 'Scatter plot of ' + (st.xmode === 'excess' ? 'implied growth above the risk-free rate' : 'implied growth') + ' against ' +
    (st.ymode === 'spread' ? 'the median spread of ROIC over WACC' : 'the share of years with ROIC above WACC') + '. The coverage table below lists the same data.');
  const yTick = v => st.ymode === 'spread' ? (v > 0.0005 ? '+' : v < -0.0005 ? '−' : '') + Math.abs(Math.round(v * 100)) + ' pts' : Math.round(v * 100) + '%';
  if(mapChart && !rebuild){
    mapChart.data.datasets = ds; mapChart.options.plugins.saS1.rf = lines;
    mapChart.options.scales.x.min = xRange[0]; mapChart.options.scales.x.max = xRange[1];
    mapChart.update('none');
  } else {
    if(mapChart) mapChart.destroy();
    mapChart = new Chart(cv, {
      type: 'scatter', data: {datasets: ds},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: {padding: {top: 44, right: 8}},   // room for the risk-free labels above the plot
        interaction: {mode: 'nearest', intersect: true},
        events: ['mousemove', 'mouseout', 'click', 'touchstart'],
        scales: {
          x: axis(P, {min: xRange[0], max: xRange[1],
            ticks: {color: P.muted, padding: 6, callback: v => Math.round(v * 100) + '%'}}),
          y: axis(P, {min: yRange[0], max: yRange[1],
            afterBuildTicks: ax => { ax.ticks = ax.ticks.filter(t => st.ymode === 'spread' || (t.value >= -1e-9 && t.value <= 1 + 1e-9)); },
            ticks: {color: P.muted, padding: 6, maxTicksLimit: 7, callback: yTick}})
        },
        plugins: {
          saS1: {rf: lines},
          legend: {display: false},
          tooltip: Object.assign(tip(P), {filter: it => it.dataset.kind === 'cur', callbacks: {

/* ─── currencies: three concepts, never mixed ───────────────────────────────
 * accountsCurrency : currency of the filing — every figure from the accounts, never converted in a calculation
 * discountCurrency : always = accountsCurrency (the WACC uses that currency's risk-free rate)
 * displayCurrency  : the header selector — applied ONLY to absolute levels (price, market value, FCF,
 *                    per-share values, analyst targets), shown under the accounts-currency figure.
 * Ratios and rates (ROIC, margins, growth, WACC, risk-free, tax) carry no currency and are never converted. */
const FX = VM.fx || {};
const displayCurrency = () => window.SAINHE_CUR || 'USD';
function fxLine(from, to){
  const fx = fxRate(FX, from, to);
  if(!fx) return to + ' per ' + from + ': N/D (no rate published, nothing converted)';
  return to + ' per ' + from + ' ' + num(fx.r, fx.r < 0.01 ? 6 : 4) + ' · ' + (fx.date || 'N/D') + ' · ' + (fx.source || 'N/D') + (fx.peg ? ' · ' + fx.peg : '');

/* header of every panel that shows amounts: which currency computes, which one is only shown */
function curLine(accountsCurrency){

  return '<p class="sa-curline">' + (same
    ? 'Computed in <strong>' + esc(accountsCurrency) + '</strong>, the currency of the accounts — also the site currency: nothing converted.'
    : 'Computed in <strong>' + esc(accountsCurrency) + '</strong>, the currency of the accounts · ' + esc(d) + ' shown for reference.<span class="sa-co">' + esc(fxLine(accountsCurrency, d)) + '</span>') + '</p>';

/* accounts-currency figure in large, display-currency equivalent in small underneath (only if different) */
function dualSub(v, accountsCurrency, fmt){

}

/* freshness: severity proportional to the growth the accounts do not yet contain */
const FRESH_GROWTH = 0.15;      // revenue growth above which 6+ months of age matter (documented in the method note)
function freshness(rep){
  const m = rep.meta || {}, t = rep.ttm || {}, mo = m.months_since_fiscal_year_end;
  const rev = series((rep.bloc_D_trends || {}).revenue_10y), yoy = rev.length >= 2 && rev[rev.length - 2][1] > 0 ? rev[rev.length - 1][1] / rev[rev.length - 2][1] - 1 : null;
  const base = 'FY end ' + (m.fiscal_year_end || 'N/D') + (isNum(mo) ? ' · ' + mo + ' months ago' : '');
  if(m.stale_financials) return {cls: 'badge-red', text: base, tip: 'Accounts older than 15 months.'};
  if(t.available && isNum(t.revenue_growth_vs_fy) && t.revenue_growth_vs_fy > FRESH_GROWTH * t.quarters_after_fy / 4)
    return {cls: 'badge-gold', text: base + ' · accounts predate ' + t.quarters_after_fy + ' quarter' + (t.quarters_after_fy > 1 ? 's' : '') + ' of reported growth',
      tip: 'Revenue over the last four quarters (to ' + t.period_end + ') is ' + pctS(t.revenue_growth_vs_fy) + ' above the last fiscal year: use the "Last four quarters" base below.'};
  if(isNum(mo) && mo >= 6 && isNum(yoy) && yoy > FRESH_GROWTH)
    return {cls: 'badge-gold', text: base + ' · ' + Math.floor(mo / 3) + ' quarters of growth not in the accounts',
      tip: 'Revenue grew ' + pctS(yoy) + ' in the last fiscal year; ' + mo + ' months have passed since, with no quarterly figures used here.'};
  return {cls: 'badge-green', text: base, tip: 'Accounts recent relative to the company\'s growth.'};
}

/* EPV, residual earnings, price and analyst median on one per-share scale — never averaged */
function valuationBar(row, rep){
  const A = rep.bloc_A_verdict || {}, meta = rep.meta || {}, cur = meta.reporting_currency || 'USD', C = A.consensus || {};
  const P = meta.price_in_reporting_currency;
  const pts_ = [['EPV', (A.EPV || {}).epv_per_share, 'no growth: current earnings capitalised forever', 'epv'],
                ['Residual earnings', (A.RE_valuation || {}).re_value_per_share, 'book value plus abnormal earnings, growth capped', 're'],
                ['Price', P, 'what the market pays today', 'price'],
                ['Analyst median', C.available ? C.target_median : null, 'external consensus, not computed here', 'consensus']];
  const ok = pts_.filter(p => isNum(p[1]));
  if(ok.length < 2 || !isNum(P)) return '';
  const vals = ok.map(p => p[1]), lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max.apply(null, vals) * 1.08;

/* ═════════════ 4 · ALLOCATION LAB ═════════════ */
let LAB = null;
const lab = {cur: 'USD', pts: {}, swap: {}, preset: 'equal', fit: null};
let growthChart = null, crisisChart = null, crisisSel = 'DotCom_2000';
const CRISES = [['DotCom_2000', 'Dot-com bust 2000–02'], ['GFC_2008', 'Financial crisis 2008–09'],
                ['COVID_2020', 'Covid crash 2020'], ['Rate_Shock_2022', 'Rate shock 2022']];
const PRESET_TXT = {
  equal: 'The same amount in every company. Use it when you have no view on which is better; it is the honest starting point and hard to beat.',
  invvol: 'More money in the calm companies, less in the jumpy ones. Use it for a smoother ride without picking favourites.',
  hrp: 'Groups companies that move together, then splits risk between the groups. Use it when your list holds several companies doing the same thing and you do not want to bet on that theme by accident.',
  maxsharpe: 'The mix that gave the most return per unit of wobble in the past. The most fitted to history, and the most likely to disappoint.',
  minvol: 'The mix that moved the least. Use it when sleeping well matters more than the last point of return.',
  lowbeta: 'Like Best Sharpe, but penalising companies that simply follow the index. Use it when you want returns that do not come from owning the market.',
  mine: 'The weights you saved in this browser.'};
const PRESET_NAME = {equal: 'Equal weight', invvol: 'Inverse volatility', hrp: 'Risk clusters (HRP)', maxsharpe: 'Best Sharpe', minvol: 'Lowest volatility', lowbeta: 'Best Sharpe, low market beta', mine: 'My saved mix'};
function renderPresetDesc(){
  const el = $('#sa-preset-desc'); if(!el) return;
  el.innerHTML = PRESET_TXT[lab.preset] ? '<strong>' + esc(PRESET_NAME[lab.preset]) + '</strong> — ' + esc(PRESET_TXT[lab.preset]) : '<strong>Your own weights</strong> — moved by hand from a preset.';
}
function positions(){   // current rows → [{t, cur, name, sector, base, w}]
  const tot = LAB.holdings.reduce((s, h) => s + (lab.pts[h.t] || 0), 0) || 1;
  return LAB.holdings.map(h => {
    const c = lab.swap[h.t] && LAB.competitors[h.t];
    return {t: c ? c.t : h.t, cur: (c ? c.cur : h.cur) || 'USD', name: c ? c.name : h.name, sector: h.sector, base: h.t, w: (lab.pts[h.t] || 0) / tot};
  });
}
/* market reference: MSCI ACWI where it traded for the whole window, else the S&P 500 (dot-com, early 2008) */
const benchT = B => B.bench || (B.r.ACWI ? 'ACWI' : 'SPY');
const benchName = B => benchT(B) === 'ACWI' ? 'MSCI ACWI (ETF)' : 'S&P 500 (ETF) — not world';
function benchSeries(B, R){ return refSeries(B, benchT(B), 'USD', R); }
/* risk-free of the measuring currency: the 10-year yield the valuation map uses for it
 * (HKD is pegged to the dollar → USD) */
function rfFor(cur){
  const pick = c => (ROWS.find(r => r.rf_currency === c && !r.rf_proxy && isNum(r.rf)) || {}).rf;
  const v = pick(cur === 'HKD' ? 'USD' : cur);
  return {rf: isNum(v) ? v : pick('USD'), cur: isNum(v) ? (cur === 'HKD' ? 'USD (HKD peg)' : cur) : 'USD'};
}

/* weights {t: >=0} -> shares of the portfolio in %, summing to 100 (kept unrounded: equal weight stays exactly equal) */
function to100(w){
  const H = LAB.holdings, s = H.reduce((a, h) => a + Math.max(0, +w[h.t] || 0), 0), out = {};
  H.forEach(h => { out[h.t] = s > 0 ? Math.max(0, +w[h.t] || 0) / s * 100 : 0; });
  return out;
}
const allocSum = () => LAB.holdings.reduce((a, h) => a + (lab.pts[h.t] || 0), 0);
function presetWeights(name){
  const H = LAB.holdings; let w = {};
  if(name !== 'maxsharpe' && name !== 'minvol' && name !== 'lowbeta') lab.fit = null;
  if(name === 'hrp') H.forEach(h => { w[h.t] = Math.max(0, +(LAB.presets.hrp || {})[h.t] || 0); });
  else if(name === 'invvol'){
    const pos = positions();
    H.forEach((h, k) => { const q = pos[k], r = refSeries(LAB.M, q.t, q.cur, lab.cur); if(!r){ w[h.t] = 0; return; }
      const a = Array.from(r).filter(isFinite), m = avg(a), sd = Math.sqrt(avg(a.map(v => (v - m) * (v - m))));
      w[h.t] = sd > 0 ? 1 / sd : 0; });
  } else if(name === 'mine'){ try{ w = JSON.parse(localStorage.getItem('sainhe_lab_mix') || '{}').pts || {}; }catch(e){ w = {}; }
    const s = H.reduce((a, h) => a + Math.max(0, +w[h.t] || 0), 0);
    if(s > 0 && s <= 100.05){ H.forEach(h => { lab.pts[h.t] = Math.max(0, +w[h.t] || 0); }); lab.preset = name;
      $$('#sa-lab-card .sa-chip[data-preset]').forEach(b => { const on = b.dataset.preset === name; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      renderPresetDesc(); return; } }
  else if(name === 'maxsharpe' || name === 'minvol' || name === 'lowbeta'){ w = optimisedWeights(name); if(!w) return; }
  else H.forEach(h => { w[h.t] = 1; });
  Object.assign(lab.pts, to100(w));   // each slider shows the holding's real share; the presets fill exactly 100%
  lab.preset = name;
  $$('#sa-lab-card .sa-chip[data-preset]').forEach(b => { const on = b.dataset.preset === name; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  renderPresetDesc();
}
/* Optimiser on the companies the user keeps (weight > 0): long-only, at most OPT_CAP per name,
 * fitted on the days all of them have prices. In-sample by construction, so an out-of-sample
 * check is shown next to it: fitted on the first 60% of the days, held on the last 40%. */
const OPT_CAP = 0.2, OPT_LOWBETA = 0.6, OPT_SPLIT = 0.6;
function optimisedWeights(name){
  const B = LAB.M, R = lab.cur, pos = positions();
  let picks = pos.map((q, k) => ({q, h: LAB.holdings[k]})).filter(x => x.q.w > 0);
  if(picks.length < 2) picks = pos.map((q, k) => ({q, h: LAB.holdings[k]}));
  const ser = picks.map(x => refSeries(B, x.q.t, x.q.cur, R));
  const ok = picks.filter((x, k) => ser[k]), S = ser.filter(Boolean);
  const rows = aligned(S), RF = rfFor(R), bench = benchSeries(B, R);
  if(rows.length < 60){ lab.optNote = '<span class="sa-nd">N/D</span>: fewer than 60 days with prices for all the companies you kept.'; return null; }
  const mode = name === 'minvol' ? 'minvol' : 'sharpe', betaCap = name === 'lowbeta' ? OPT_LOWBETA : undefined;
  const m = moments(S, rows, bench), wv = optimize(m, {mode, rf: RF.rf, cap: Math.max(OPT_CAP, 1 / S.length), betaCap});
  const cut = Math.floor(rows.length * OPT_SPLIT), fitRows = rows.slice(0, cut), testRows = rows.slice(cut);
  const wFit = optimize(moments(S, fitRows, bench), {mode, rf: RF.rf, cap: Math.max(OPT_CAP, 1 / S.length), betaCap});
  const eqW = S.map(() => 1 / S.length), tOpt = evaluate(S, testRows, wFit, RF.rf), tEq = evaluate(S, testRows, eqW, RF.rf);
  const d = i => B.dates[i], beta = m.beta ? m.beta.reduce((s, b, i) => s + b * wv[i], 0) : null;
  const firstIdx = S.map(sr => { for(let i = 1; i < sr.length; i++) if(isFinite(sr[i])) return i; return sr.length; });
  lab.fit = {i0: rows[0], i1: rows[rows.length - 1], n: rows.length,
    late: ok.filter((x, k) => firstIdx[k] >= rows[0] - 5 && rows[0] > 5).map(x => x.q.t)};
  const label = {maxsharpe: 'Best Sharpe ratio', minvol: 'Lowest volatility', lowbeta: 'Best Sharpe with market beta ≤ ' + OPT_LOWBETA}[name];
  lab.optNote = '<strong>' + esc(label) + '</strong> on the ' + S.length + ' companies you kept, at most ' + pct(Math.max(OPT_CAP, 1 / S.length), 0) +
    ' each, fitted on ' + esc(d(rows[0])) + ' → ' + esc(d(rows[rows.length - 1])) + ' (' + rows.length.toLocaleString('en-US') + ' days, in ' + esc(R) + ')' +
    (isNum(beta) ? ', beta vs ACWI ' + esc(num(beta, 2)) : '') + '. Fitted on the past, it looks better than it will. ' +
    '<strong>Out-of-sample check:</strong> fitted on ' + esc(d(fitRows[0])) + ' → ' + esc(d(fitRows[fitRows.length - 1])) + ', then held ' +
    esc(d(testRows[0])) + ' → ' + esc(d(testRows[testRows.length - 1])) + ': Sharpe ' + H(isNum(tOpt.sharpe) ? num(tOpt.sharpe, 2) : 'N/D') +
    ' vs ' + H(isNum(tEq.sharpe) ? num(tEq.sharpe, 2) : 'N/D') + ' for equal weights, volatility ' + H(pct(tOpt.vol)) + ' vs ' + H(pct(tEq.vol)) +
    '. Set a company to 0 to leave it out. Not a recommendation.';
  const w = {}; ok.forEach((x, k) => { w[x.h.t] = wv[k]; });
  return w;
}

  if(mcChart) mcChart.destroy();
  mcChart = new Chart($('#sa-mc'), {type: 'line', data: {labels, datasets: ds}, options: {
    responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: 'index', intersect: false},
    scales: {x: axis(P, {grid: {display: false}, ticks: {color: P.muted, autoSkip: false, maxRotation: 0, callback: function(v){ return this.getLabelForValue(v); }}}),
             y: axis(P, {ticks: {color: P.muted, maxTicksLimit: 6, callback: v => big(v)}})},
    plugins: {legend: {display: true, position: 'top', align: 'end', labels: {color: P.p, boxWidth: 14, filter: it => !/percentile/.test(it.text)}},
      tooltip: Object.assign(tip(P), {filter: it => !/percentile/.test(it.dataset.label), callbacks: {
        title: it => 'Month ' + it[0].dataIndex, label: it => it.dataset.label + '  ' + fmtMoney(it.raw, R)}})}
  }});
  const tl = TL ? '<strong>Tail-adjusted.</strong> Every simulated day that loses more than ' + esc(pct(TL.thr, 2)) + ' is redrawn from a generalised Pareto distribution — extreme-value theory, peaks over threshold — fitted by probability-weighted moments (Hosking &amp; Wallis, 1987) on the worst ' +
      esc(pct(1 - MC_TAIL_Q, 0)) + ' of S&amp;P 500 days ' + esc((LAB.long_ref || {}).from || '') + ' → ' + esc((LAB.long_ref || {}).to || '') + ': ' + TL.n.toLocaleString('en-US') + ' tail days out of ' + TL.N.toLocaleString('en-US') +
      ', threshold ' + esc(num(TL.u, 2)) + ' daily standard deviations, shape ξ = ' + esc(num(TL.xi, 3)) + ', scale ' + esc(num(TL.beta / TL.scale / TL.sdRef, 3)) + ' standard deviations. The tail is rescaled to this allocation\'s daily volatility (' + esc(pct(sdP, 2)) +
      ' vs ' + esc(pct(TL.sdRef, 2)) + ' for the S&amp;P 500) and any day is floored at −' + esc(pct(TL.cap, 0)) + ' (twice the worst S&amp;P 500 day of that history, in volatility units). Only the tail days change: the blocks are the same ' + Ns + ' paths. ' +
      'Assumption to keep in mind: this allocation\'s extreme days are shaped like the market\'s, in proportion to its volatility. ' : '<strong>Tail-adjusted</strong>: <span class="sa-nd">N/D</span> (long reference series unavailable). ';
  $('#sa-mc-note').innerHTML = '<strong>Method.</strong> Stationary block bootstrap (Politis &amp; Romano, 1994): blocks of random length — on average ' + MC_BLOCK + ' trading days, geometrically distributed, wrapping around the end of the sample — drawn from this allocation\'s ' + res.sample.toLocaleString('en-US') +
    ' daily returns from ' + esc(B.dates[0]) + ' to ' + esc(B.dates[B.dates.length - 1]) + ', in ' + esc(R) + ', rebalanced every day to your weights. ' + Ns + ' paths, fixed seed ' + MC_SEED + ': the same paths on every reload. Blocks keep the clustering of real markets: a bad week tends to follow a bad week. ' +
    '<strong>Limit:</strong> a bootstrap can only reshuffle the days it was given, so it cannot produce a fall deeper than its sample allows; the last five years include the 2022 rate shock but not a 2008-style crash, so the raw tail is too thin. ' + tl +
    (lab.fit && lab.fit.i0 > 5 ? '<strong>Look-ahead:</strong> the weights were fitted on ' + esc(B.dates[lab.fit.i0]) + ' → ' + esc(B.dates[lab.fit.i1]) + ', but the paths draw from all five years, including days before those weights existed — this spread flatters the optimised mix. ' : '') +
    '<strong>This is a spread, not a forecast</strong> — and the crisis replay below shows real falls, which can be worse than any path here.';
  };
  if(mcLast && mcLast.key === key){ draw(mcLast.out); return; }
  if(card) card.classList.add('sa-mc-busy');
  mcRun([{ret, o}, TL ? {ret, o: Object.assign({}, o, {tail: TL})} : null, bret ? {ret: bret, o} : null], out => {
    if(GEN !== window._saGen || !$('#sa-mc')) return;
    if(card) card.classList.remove('sa-mc-busy');
    draw(out);
  });
}

/* ═════════════ 5 · CRISIS REPLAY ═════════════ */
function crisisRun(B, pos, R){
  const n = B.dates.length;
  const avail = pos.map(q => { const r = B.r[q.t]; if(!r) return false; let k = 0; for(let i = 1; i < n; i++) if(isFinite(r[i])) k++; return k >= 0.9 * (n - 1); });
  const inc = pos.filter((q, k) => avail[k] && q.w > 0), wtot = pos.reduce((s, q) => s + q.w, 0) || 1;
  const covW = inc.reduce((s, q) => s + q.w, 0) / wtot;
  const a = portfolio(B, inc, R), eqList = pos.filter((q, k) => avail[k]);
  const e = portfolio(B, eqList.map(q => Object.assign({}, q, {w: 1})), R);
  const bench = benchSeries(B, R), bp = new Float64Array(n); for(let i = 1; i < n; i++) bp[i] = bench && isFinite(bench[i]) ? bench[i] : 0;
  return {a: stats(B, a.p, null), e: stats(B, e.p, null), b: stats(B, bp, null), nInc: inc.length, nPos: pos.filter(q => q.w > 0).length, covW,
    missing: pos.filter((q, k) => !avail[k] && q.w > 0).map(q => q.t), turb: turbFor(B, inc, R)};
}
/* turbulence (Kritzman & Li 2010): how unusual each day's moves AND co-moves of the companies
 * replayed were, against their mean and covariance over the Lab's five years. Memoised per set. */
const turbMemo = {};
function turbFor(BC, inc, R){
  const ks = inc.map(q => q.t).sort(), key = BC.start + '|' + R + '|' + ks.join(',');
  if(key in turbMemo) return turbMemo[key];
  let out = null;
  if(ks.length >= 2){
    const sh = inc.map(q => refSeries(LAB.M, q.t, q.cur, R)), sc = inc.map(q => refSeries(BC, q.t, q.cur, R));
    if(sh.every(Boolean) && sc.every(Boolean)){
      const hist = aligned(sh).map(i => sh.map(s => s[i])), test = aligned(sc).map(i => sc.map(s => s[i]));
      out = turbulence(hist, test); if(out) out.k = ks.length;
    }
  }
  return (turbMemo[key] = out);
}
function renderCrisis(){
  if(!LAB || GEN !== window._saGen || !$('#sa-crisis-tbl')) return;
  const pos = positions(), R = lab.cur, P = pal(), tb = $('#sa-crisis-tbl tbody');
  const res = {};
  CRISES.forEach(([k]) => { if(LAB.C[k]) res[k] = crisisRun(LAB.C[k], pos, R); });
  tb.innerHTML = CRISES.filter(([k]) => res[k]).map(([k, l]) => { const r = res[k], B = LAB.C[k];
    const tb_ = r.turb ? '<span tabindex="0" data-tt="' + esc('Kritzman & Li (2010) turbulence on the ' + r.turb.k + ' companies replayed: ' + pct(r.turb.share, 0) + ' of the days were more unusual — in size and in how the companies moved together — than 95% of the days of the last five years (5% by construction in normal times).' + (k === 'Rate_Shock_2022' ? ' The five-year reference contains 2022 itself, so this understates it.' : '')) + '">' + esc(pct(r.turb.share, 0)) + '</span>' : NDH;
    return '<tr data-c="' + k + '"' + (k === crisisSel ? ' class="sel"' : '') + ' tabindex="0"><td class="l">' + esc(l) + '</td><td>' + esc(B.start) + ' → ' + esc(B.end) + '</td>' +
      '<td>' + H(pctS(r.a.total)) + '</td><td>' + H(pct(r.a.mdd)) + '</td><td>' + H(pctS(r.e.total)) + '</td><td>' + H(pctS(r.b.total)) +
      (benchT(B) === 'SPY' ? '<span class="sa-co">S&amp;P 500, not world</span>' : '<span class="sa-co">MSCI ACWI</span>') + '</td><td>' + tb_ + '</td>' +
      '<td class="l" title="' + esc(r.missing.length ? 'Not listed then: ' + r.missing.join(', ') : 'All holdings listed') + '">' + r.nInc + '/' + r.nPos + ' holdings · ' + pct(r.covW, 0) + ' of weight' +
      (r.missing.length ? ' <span class="sa-co">missing ' + esc(r.missing.slice(0, 4).join(', ')) + (r.missing.length > 4 ? '…' : '') + '</span>' : '') + '</td></tr>'; }).join('');
  const pick = $('#sa-crisis-pick');
  pick.innerHTML = '<span class="sa-kicker">Replay</span>' + CRISES.filter(([k]) => res[k]).map(([k, l]) => '<button class="sa-chip' + (k === crisisSel ? ' on' : '') + '" data-c="' + k + '" aria-pressed="' + (k === crisisSel) + '">' + esc(l) + '</button>').join('') +
    '<span class="sa-sep" aria-hidden="true"></span><span class="sa-note">measured in ' + esc(R) + ' · S&amp;P 500 peak to trough, from one week before the peak</span>';
  const B = LAB.C[crisisSel], r = res[crisisSel]; if(!B || !r) return;
  const ds = [{label: 'Your allocation', data: r.a.path, borderColor: P.s1, backgroundColor: P.s1, borderWidth: 2.2, pointRadius: 0, tension: 0},
              {label: 'Equal weight', data: r.e.path, borderColor: P.s3, backgroundColor: P.s3, borderWidth: 1.6, pointRadius: 0, tension: 0},
              {label: benchName(B), data: r.b.path, borderColor: P.s2, backgroundColor: P.s2, borderWidth: 1.6, pointRadius: 0, tension: 0}];
  $('#sa-crisis').setAttribute('aria-label', 'Value of 100 invested from ' + B.start + ' to ' + B.end + ': your allocation (companies listed then) ' + pctS(r.a.total) + ', equal weight ' + pctS(r.e.total) + ', ' + benchName(B) + ' ' + pctS(r.b.total) + '. The table below gives the figures.');
  const cov = $('#sa-crisis-cov');
  if(cov) cov.innerHTML = 'Replayed with <strong>' + r.nInc + ' of your ' + r.nPos + ' holdings</strong> (' + esc(pct(r.covW, 0)) + ' of your weight) — the companies listed on ' + esc(B.start) + '. ' +
    'Their weights are rescaled to 100%; the others are left out, never proxied. This is not the history of your portfolio, which did not exist then: it is how today\'s choice of companies, among those already listed, went through the crisis.' +
    (benchT(B) === 'SPY' ? ' No world ETF traded then: the market line is the S&amp;P 500.' : '');
  if(crisisChart){ crisisChart.data.labels = B.dates; crisisChart.data.datasets = ds; crisisChart.update('none'); }
  else { crisisChart = lineChart($('#sa-crisis'), B.dates, ds, R); crisisChart.options.scales.x.ticks.callback = function(v){ return String(this.getLabelForValue(v)).slice(0, 10); }; crisisChart.update('none'); }
}
