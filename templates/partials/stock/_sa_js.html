<script>
/* ══════ STOCK ANALYSIS — phase 1 ═════════════════════════════════════════
 * 1. Quality × Price map      (valuation map, embedded)
 * 2. "What you have to believe" simulator  (reverse DCF on the user's inputs)
 * 3. Every number → its source (drawer: formula, inputs, XBRL tag, filing link)
 * 4. Allocation Lab           (weights, rival swap, currency lens — lab_data.json)
 * 5. Crisis replay            (the Lab allocation through 5 stress windows)
 * Zero prediction: everything is arithmetic on filed numbers or past prices.
 * ═════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
if(!window.Chart || !window.SACALC) return;
const {derive, simImplied, simValue, decode, refSeries, portfolio, stats, riskContrib, bootstrap, aligned, moments, optimize, evaluate} = window.SACALC;
const VM = JSON.parse((document.getElementById('sa-vmap')||{}).textContent || '{}') || {};
const ROWS = (VM.rows || []).slice();
const BASE = '/data/stock/';
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const isNum = v => typeof v === 'number' && isFinite(v);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NDH = '<span class="sa-nd">N/D</span>';
const H = t => t === 'N/D' ? NDH : esc(t);               // plain text → safe HTML (N/D greyed)
const pct = (v, d) => { if(!isNum(v)) return 'N/D'; const s = Math.abs(v * 100).toFixed(d == null ? 1 : d); return (v < 0 && +s !== 0 ? '−' : '') + s + '%'; };
function signed(v, d, unit){ if(!isNum(v)) return 'N/D'; const s = Math.abs(v * 100).toFixed(d == null ? 1 : d); return (+s === 0 ? '±' : v > 0 ? '+' : '−') + s + unit; }
const pctS = (v, d) => signed(v, d, '%');
const pts = (v, d) => signed(v, d, ' pts');
function niceMax(v){ if(!(v > 0)) return 1; const m = Math.pow(10, Math.floor(Math.log10(v))) / 2; return Math.ceil(v / m) * m; }
const num = (v, d) => isNum(v) ? v.toLocaleString('en-US', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}).replace(/^-/, '−') : 'N/D';
function big(v, cur){
  if(!isNum(v)) return 'N/D';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  let s;
  if(a >= 1e12) s = (a / 1e12).toFixed(2) + ' tn';
  else if(a >= 1e9) s = (a / 1e9).toFixed(1) + ' bn';
  else if(a >= 1e6) s = (a / 1e6).toFixed(1) + ' m';
  else s = a.toLocaleString('en-US', {maximumFractionDigits: 2});
  return (cur ? cur + ' ' : '') + sg + s;
}
const money = (v, cur) => isNum(v) ? (cur ? cur + ' ' : '') + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/D';
function median(a){ const s = a.filter(isNum).sort((x, y) => x - y); if(!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
function series(obj){ return Object.keys(obj || {}).filter(k => isNum(obj[k])).sort().map(k => [k, obj[k]]); }
function lastOf(obj){ const s = series(obj); return s.length ? s[s.length - 1] : null; }

/* ── theme-aware colours (series palette validated, see _sa_style.html) ── */
function cssv(n, el){ return getComputedStyle(el || document.documentElement).getPropertyValue(n).trim(); }
function pal(){
  const sa = $('.sa');
  return {s1: cssv('--s1', sa), s2: cssv('--s2', sa), s3: cssv('--s3', sa),
    h: cssv('--h'), p: cssv('--p'), muted: cssv('--muted'), faint: cssv('--faint'), grid: cssv('--border-lt'),
    border: cssv('--border'), card: cssv('--card'), goldBg: cssv('--gold-bg'), gold: cssv('--gold')};
}
const FONT = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.family = FONT;
Chart.defaults.font.size = 11;
const restyle = [];
new MutationObserver(() => restyle.forEach(f => { try{ f(); }catch(e){ console.error(e); } }))
  .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
function axis(P, extra){
  return Object.assign({grid: {color: P.grid, drawTicks: false}, border: {display: false},
    ticks: {color: P.muted, padding: 6}}, extra || {});
}
function tip(P){
  return {backgroundColor: P.card, titleColor: P.h, bodyColor: P.p, borderColor: P.border, borderWidth: 1,
    padding: 10, cornerRadius: 8, displayColors: true, boxPadding: 4, usePointStyle: true};
}

/* ── data ── */
const cache = {};
function getJSON(name){
  if(!cache[name]) cache[name] = fetch(BASE + name).then(r => { if(!r.ok) throw new Error(name + ' HTTP ' + r.status); return r.json(); });
  return cache[name];
}
const report = t => getJSON(encodeURIComponent(t) + '_report.json');

ROWS.forEach(r => {
  const m = /^(\d+)\s*\/\s*(\d+)$/.exec(String(r.roic_years_above_wacc || ''));
  r.roic_share = m && +m[2] > 0 ? (+m[1]) / (+m[2]) : null;
  r.roic_txt = m ? m[1] + '/' + m[2] + ' yrs' : 'N/D';
  r.src_kind = /Yahoo/.test(r.source || '') ? 'YF' : /20-F/.test(r.source || '') ? '20-F' : /ESEF/.test(r.source || '') ? 'ESEF' : '10-K';
  ['implied_growth', 'sgr', 'ecart_pct', 'prix', 'epv_per_share', 're_per_share', 'rf'].forEach(k => { if(!isNum(r[k])) r[k] = null; });
});
const ROW = {}; ROWS.forEach(r => { ROW[r.ticker] = r; });
const SRC_NAME = {'10-K': 'US 10-K', '20-F': 'Foreign 20-F', 'ESEF': 'Europe ESEF', 'YF': 'Yahoo (secondary)'};
const asOf = $('#sa-asof'); if(asOf && VM.as_of) asOf.textContent = 'as of ' + VM.as_of;

/* ═════════════ 1 · QUALITY × PRICE — map + table, one shared state ═════════════
 * hover  : transient highlight, table row ↔ point (both directions)
 * brush  : Set of tickers drawn as a rectangle on the map — filters the table
 * compare: up to 4 tickers side by side, kept while filtering
 * dW     : WACC shift applied to every company (−2..+2 pts), base case drawn in outline
 * `selected` (the company in focus) drives the audit drawer and section 02.
 * Every figure comes from valuation_map.json; recomputations are arithmetic only. */
const TH = VM.thresholds || {};
const st = {hover: null, brush: null, compare: [], dW: 0, src: 'all', hideStale: false, sort: {k: 'gap', dir: -1}};
let mapChart = null, selected = null, drag = null, noClick = false, xRange = null;
const SHAPE = {'10-K': 'circle', '20-F': 'triangle', 'ESEF': 'rectRot', 'YF': 'rect'};
// secondary source: neutral ink, not a fourth categorical hue (the validated palette has three)
const SLOT = {'10-K': 's1', '20-F': 's2', 'ESEF': 's3', 'YF': 'muted'};
const icTxt = isNum(TH.ic_nm_min_share_of_assets) ? pct(TH.ic_nm_min_share_of_assets, 0) : 'the published share';
const NM_TXT = {
  negative_net_reinvestment: 'n/m — net reinvestment is negative (capex below depreciation and/or working capital released): growth is not funded by reinvestment.',
  reinvestment_exceeds_nopat: 'n/m — reinvestment exceeds after-tax operating profit: growth is funded from outside, not self-sustained.',
  invested_capital_near_zero: 'n/m — invested capital is below ' + icTxt + ' of total assets: the ROIC denominator is close to zero, so ROIC and sustainable growth are artefacts.'
};
function alpha(c, a){
  const m = /^#([0-9a-f]{6})$/i.exec(String(c).trim()); if(!m || a >= 1) return c;
  const n = parseInt(m[1], 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
const filtered = () => ROWS.filter(r => (st.src === 'all' || r.src_kind === st.src) && !(st.hideStale && r.stale_financials));
function rfLines(rows){
  const m = {};
  rows.forEach(r => { if(!isNum(r.rf)) return; const k = r.rf.toFixed(4);
    const l = (m[k] = m[k] || {rf: r.rf, cur: new Set(), proxy: new Set()}); l[r.rf_proxy ? 'proxy' : 'cur'].add(r.rf_currency); });
  return Object.keys(m).map(k => m[k]).sort((a, b) => a.rf - b.rf);
}
function computeXRange(rows){
  const xs = [];   // fixed over the whole slider range: points move, the axis does not
  rows.forEach(r => [-0.02, 0, 0.02].forEach(d => { const g = derive(r, d).g; if(isNum(g)) xs.push(g); }));
  rfLines(rows).forEach(l => xs.push(l.rf));
  if(!xs.length) return [-0.02, 0.15];
  return [Math.floor((Math.min.apply(null, xs) - .01) * 100) / 100, Math.ceil((Math.max.apply(null, xs) + .01) * 100) / 100];
}

/* — map: quadrant labels, risk-free lines, base-case links, ticker labels, brush rectangle — */
const s1Plugin = {
  id: 'saS1',
  beforeDatasetsDraw(chart, args, opts){
    const {ctx, chartArea: a, scales: {x, y}} = chart, P = pal(), narrow = a.right - a.left < 520;
    const obs = chart.$saObs = [];
    const put = (txt, px, py, align) => { const w = ctx.measureText(txt).width;
      let x0 = align === 'right' ? px - w : px;
      if(align !== 'right' && x0 + w > a.right - 4) x0 = px - 8 - w;
      x0 = Math.max(a.left + 4, Math.min(x0, a.right - 4 - w));
      ctx.textAlign = 'left'; ctx.fillText(txt, x0, py); obs.push({x: x0 - 2, y: py - 10, w: w + 4, h: 13}); };
    ctx.save();
    const yp = y.getPixelForValue(0.5);
    ctx.strokeStyle = P.border; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(a.left, yp); ctx.lineTo(a.right, yp); ctx.stroke();
    ctx.font = '10px ' + FONT; ctx.fillStyle = P.muted; ctx.strokeStyle = P.muted; ctx.setLineDash([5, 4]);
    const labelRf = a.right - a.left >= 640;
    (opts.rf || []).forEach((l, i) => {
      const xp = x.getPixelForValue(l.rf); if(xp < a.left || xp > a.right) return;
      ctx.beginPath(); ctx.moveTo(xp, a.top); ctx.lineTo(xp, a.bottom); ctx.stroke();
      if(!labelRf) return;
      const curs = Array.from(l.cur).join('/'), prox = Array.from(l.proxy).join('/');
      put((narrow ? 'rf ' : 'risk-free ') + curs + (prox ? (curs ? ' · ' : '') + prox + (narrow ? '*' : ' (US proxy)') : '') + ' ' + pct(l.rf), xp + 4, a.bottom - 24 - i * 13, 'left');
    });
    ctx.setLineDash([]); ctx.font = '600 9.5px ' + FONT;
    const L = narrow ? ['PROVEN · MODEST', 'PROVEN · DEMANDING', 'UNPROVEN · MODEST', 'UNPROVEN · DEMANDING']
                     : ['PROVEN RETURNS · MODEST EXPECTATIONS', 'PROVEN RETURNS · DEMANDING EXPECTATIONS',
                        'UNPROVEN RETURNS · MODEST EXPECTATIONS', 'UNPROVEN RETURNS · DEMANDING EXPECTATIONS'];
    put(L[0], a.left + 8, a.top + 14, 'left'); put(L[1], a.right - 8, a.top + 14, 'right');
    put(L[2], a.left + 8, a.bottom - 8, 'left'); put(L[3], a.right - 8, a.bottom - 8, 'right');
    ctx.restore();
  },
  afterDatasetsDraw(chart){
    const {ctx, chartArea: a} = chart, P = pal(), cur = [], ghost = {};
    chart.data.datasets.forEach((ds, i) => { const meta = chart.getDatasetMeta(i); if(meta.hidden) return;
      meta.data.forEach((pt, j) => { const t = ds.data[j].t; if(ds.kind === 'ghost') ghost[t] = pt; else cur.push({x: pt.x, y: pt.y, t}); }); });
    ctx.save();
    ctx.strokeStyle = alpha(P.muted, .7); ctx.lineWidth = 1;
    cur.forEach(p => { const g = ghost[p.t]; if(g && Math.hypot(g.x - p.x, g.y - p.y) > 3){ ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(p.x, p.y); ctx.stroke(); } });
    const placed = cur.map(p => ({x: p.x - 8, y: p.y - 8, w: 16, h: 16})).concat(chart.$saObs || []);
    const hit = b => placed.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
    ctx.font = '700 10px "SF Mono",Consolas,monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const rank = t => (t === st.hover ? 2 : 0) + (t === selected ? 1 : 0);
    cur.sort((u, v) => rank(v.t) - rank(u.t)).forEach(p => {
      const w = ctx.measureText(p.t).width, cands = [];
      [0, -10, 10].forEach(off => { cands.push([p.x + 10, p.y + off]); cands.push([p.x - 10 - w, p.y + off]); });
      const best = cands.find(c => c[0] > a.left && c[0] + w < a.right && !hit({x: c[0] - 1, y: c[1] - 6, w: w + 2, h: 12}));
      if(!best) return;
      placed.push({x: best[0] - 1, y: best[1] - 6, w: w + 2, h: 12});
      const dim = st.brush && !st.brush.has(p.t);
      ctx.fillStyle = rank(p.t) ? P.gold : (dim ? alpha(P.h, .3) : P.h);
      ctx.fillText(p.t, best[0], best[1]);
    });
    ctx.restore();
  },
  afterDraw(chart){
    if(!drag || !drag.on) return;
    const {ctx} = chart, P = pal(), x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
    ctx.save(); ctx.fillStyle = alpha(P.s2, .08); ctx.strokeStyle = P.s2; ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
    ctx.fillRect(x, y, Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0));
    ctx.strokeRect(x, y, Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0)); ctx.restore();
  }
};
function mapDatasets(rows){
  const P = pal(), out = [];
  const dim = t => st.brush && !st.brush.has(t), hot = t => t === st.hover || t === selected;
  ['10-K', '20-F', 'ESEF', 'YF'].forEach(k => {
    const col = P[SLOT[k]], set = rows.filter(r => r.src_kind === k);
    const pt = (r, dW) => { const d = derive(r, dW); return isNum(d.g) && isNum(d.share) ? {x: d.g, y: d.share, t: r.ticker} : null; };
    const cur = set.map(r => pt(r, st.dW)).filter(Boolean);
    out.push({label: SRC_NAME[k], kind: 'cur', data: cur, pointStyle: SHAPE[k], order: 1,
      pointRadius: cur.map(p => p.t === st.hover ? 10 : p.t === selected ? 8.5 : 6.5), pointHoverRadius: 10, pointHitRadius: 10,
      backgroundColor: cur.map(p => alpha(ROW[p.t].stale_financials ? P.card : col, dim(p.t) ? .2 : 1)),
      borderColor: cur.map(p => hot(p.t) ? P.h : (ROW[p.t].stale_financials ? alpha(col, dim(p.t) ? .3 : 1) : P.card)),
      borderWidth: cur.map(p => hot(p.t) ? 2.5 : (ROW[p.t].stale_financials ? 2.2 : 1.5))});
    if(st.dW !== 0){
      const base = set.map(r => pt(r, 0)).filter(Boolean);
      out.push({label: SRC_NAME[k] + ' · base case', kind: 'ghost', data: base, pointStyle: SHAPE[k], order: 2,
        pointRadius: 6, pointHoverRadius: 6, pointHitRadius: 0, backgroundColor: 'rgba(0,0,0,0)', borderColor: alpha(col, .5), borderWidth: 1.5});
    }
  });
  return out;
}
function renderMap(rebuild){
  const cv = $('#sa-map'); if(!cv) return;
  const rows = filtered(), P = pal();
  if(rebuild || !xRange) xRange = computeXRange(rows);
  const ds = mapDatasets(rows), lines = rfLines(rows);
  const xTitle = 'Perpetual FCF growth implied by the price (reverse DCF)' + (st.dW ? ' — WACC ' + signed(st.dW, 2, ' pt') : '');
  if(mapChart && !rebuild){
    mapChart.data.datasets = ds; mapChart.options.plugins.saS1.rf = lines;
    mapChart.options.scales.x.min = xRange[0]; mapChart.options.scales.x.max = xRange[1];
    mapChart.options.scales.x.title.text = xTitle; mapChart.update('none');
  } else {
    if(mapChart) mapChart.destroy();
    mapChart = new Chart(cv, {
      type: 'scatter', data: {datasets: ds},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: {padding: {top: 6, right: 8}},
        interaction: {mode: 'nearest', intersect: true},
        events: ['mousemove', 'mouseout', 'click', 'touchstart'],
        scales: {
          x: axis(P, {min: xRange[0], max: xRange[1], title: {display: true, text: xTitle, color: P.muted},
            ticks: {color: P.muted, padding: 6, callback: v => Math.round(v * 100) + '%'}}),
          y: axis(P, {min: -.09, max: 1.2, title: {display: true, text: 'Years with ROIC above WACC', color: P.muted},
            afterBuildTicks: ax => { ax.ticks = [0, .25, .5, .75, 1].map(v => ({value: v})); },
            ticks: {color: P.muted, padding: 6, callback: v => Math.round(v * 100) + '%'}})
        },
        plugins: {
          saS1: {rf: lines},
          legend: {display: false},
          tooltip: Object.assign(tip(P), {filter: it => it.dataset.kind === 'cur', callbacks: {
            title: it => { const r = ROW[it[0].raw.t]; return r.name + ' (' + r.ticker + ')'; },
            label: it => { const r = ROW[it.raw.t], d = derive(r, st.dW); return [
              'Implied growth  ' + pct(d.g) + (st.dW ? '  (base ' + pct(r.implied_growth) + ')' : ''),
              'ROIC > WACC  ' + (d.n ? d.up + '/' + d.n + ' yrs' : 'N/D'),
              'Sustainable growth  ' + (d.sgrOk ? pct(r.sgr) : d.sgrNm ? 'n/m' : 'N/D'),
              'WACC  ' + pct(d.w) + ' · risk-free ' + (r.rf_currency || '') + ' ' + pct(r.rf) + (r.rf_proxy ? ' (US proxy)' : ''),
              'Accounts  ' + SRC_NAME[r.src_kind] + ' · FY end ' + (r.fiscal_year_end || 'N/D') + (r.stale_financials ? ' (older than 15 months)' : '')]; },
            footer: () => 'Click for the audit trail'}})
        },
        onHover: (e, els) => {
          const el = els.find(x => mapChart.data.datasets[x.datasetIndex].kind === 'cur');
          const t = el ? mapChart.data.datasets[el.datasetIndex].data[el.index].t : null;
          e.native.target.style.cursor = t ? 'pointer' : 'crosshair';
          if(t !== st.hover){ st.hover = t; hlRow(true); }
        },
        onClick: (e, els) => {
          if(noClick) return;
          const el = els.find(x => mapChart.data.datasets[x.datasetIndex].kind === 'cur');
          if(el) focusCompany(mapChart.data.datasets[el.datasetIndex].data[el.index].t, null);
        }
      },
      plugins: [s1Plugin]
    });
  }
  const un = rows.filter(r => { const d = derive(r, st.dW); return !(isNum(d.g) && isNum(d.share)); });
  $('#sa-unplaced').innerHTML = un.length
    ? '<strong>Not placed (N/D):</strong> ' + un.map(r => '<button class="sa-src" data-open="' + esc(r.ticker) + '">' + esc(r.ticker) + '</button>').join(', ') +
      ' — implied growth needs positive free cash flow and a known net debt, and the vertical axis needs at least one meaningful ROIC year. Nothing is imputed.'
    : '';
  if(!un.length) $('#sa-unplaced').innerHTML = '';
  const rfl = $('#sa-rfleg');
  if(rfl) rfl.textContent = lines.length ? 'Risk-free rate by currency, dashed lines from left to right: ' + lines.map(l => {
    const c = Array.from(l.cur).join('/'), p = Array.from(l.proxy).join('/');
    return (c ? c + ' ' : '') + (p ? (c ? '· ' : '') + p + ' (US proxy) ' : '') + pct(l.rf);
  }).join(' · ') + '.' : '';
  const oos = VM.out_of_scope || {};
  $('#sa-unplaced').innerHTML += (Object.keys(oos).length ? '<div style="margin-top:6px"><strong>Outside the scope:</strong> ' +
    Object.keys(oos).map(t => '<span class="sa-tk">' + esc(t) + '</span> ' + esc(oos[t])).join(' · ') + '.</div>' : '');
  $('#sa-lg-ghost').hidden = !st.dW;
}
function bindBrush(){
  const cv = $('#sa-map'); if(!cv) return;
  const rel = e => { const b = cv.getBoundingClientRect(); return {x: e.clientX - b.left, y: e.clientY - b.top}; };
  const tgl = $('#sa-brush-toggle');
  if(tgl) tgl.addEventListener('click', () => {
    st.touchBrush = !st.touchBrush; tgl.setAttribute('aria-pressed', st.touchBrush);
    tgl.textContent = st.touchBrush ? 'Done selecting' : 'Select an area on the map';
    cv.style.touchAction = st.touchBrush ? 'none' : '';
  });
  cv.addEventListener('pointerdown', e => {
    if(!mapChart || (e.pointerType === 'touch' && !st.touchBrush) || e.button !== 0) return;
    const a = mapChart.chartArea, p = rel(e);
    if(p.x < a.left || p.x > a.right || p.y < a.top || p.y > a.bottom) return;
    drag = {x0: p.x, y0: p.y, x1: p.x, y1: p.y, on: false};
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });
  cv.addEventListener('pointermove', e => {
    if(!drag) return;
    const a = mapChart.chartArea, p = rel(e);
    drag.x1 = Math.min(Math.max(p.x, a.left), a.right); drag.y1 = Math.min(Math.max(p.y, a.top), a.bottom);
    if(!drag.on && Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0) > 6) drag.on = true;
    if(drag.on) mapChart.draw();
  });
  cv.addEventListener('pointerup', () => {
    if(!drag) return;
    const d = drag; drag = null;
    if(!d.on){ mapChart.draw(); return; }
    noClick = true; setTimeout(() => { noClick = false; }, 0);
    const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1), sel = new Set();
    mapChart.data.datasets.forEach((ds, i) => { if(ds.kind !== 'cur') return;
      mapChart.getDatasetMeta(i).data.forEach((pt, j) => { if(pt.x >= x0 && pt.x <= x1 && pt.y >= y0 && pt.y <= y1) sel.add(ds.data[j].t); }); });
    st.brush = sel.size ? sel : null;
    renderS1();
  });
  cv.addEventListener('pointercancel', () => { drag = null; if(mapChart) mapChart.draw(); });
  cv.addEventListener('mouseleave', () => { if(st.hover && !drag){ st.hover = null; hlRow(false); } });
}

/* — coverage table — */
const SORTV = {
  ticker: r => r.ticker, sector: r => r.sector || null,
  g: (r, d) => isNum(d.g) ? d.g : null, sgr: (r, d) => d.sgrOk ? r.sgr : null,
  gap: (r, d) => isNum(d.gap) ? d.gap : null, roic: (r, d) => d.share,
  epv: r => isNum(r.ecart_pct) ? r.ecart_pct : null, flags: r => (r.flags || []).length,
  acc: r => r.fiscal_year_end || null
};
const flagTitle = id => (FLAG_EN[id] || [String(id || '').replace(/_/g, ' ')])[0];
function nmHTML(t){ return '<span class="sa-nm" tabindex="0" data-tt="' + esc(t) + '">n/m</span>'; }
function sgrCell(r, d){ return d.sgrOk ? esc(pct(r.sgr)) : d.sgrNm ? nmHTML(NM_TXT[r.sgr_nm_reason] || 'n/m') : NDH; }
function gapCell(r, d){
  if(isNum(d.gap)) return esc(pts(d.gap));
  return d.gap === 'n/m' ? nmHTML('n/m — sustainable growth is not meaningful for this company, so the gap is not computed.') : NDH;
}
function cellTip(c, w){
  if(c.s === 'nm') return c.y + ' · ROIC ' + pct(c.v) + ' — not meaningful: invested capital below ' + icTxt + ' of total assets';
  if(c.s === 'nd') return c.y + ' · ' + (isNum(c.v) ? 'ROIC ' + pct(c.v) + ', WACC N/D' : 'ROIC N/D');
  return c.y + ' · ROIC ' + pct(c.v) + ' − WACC ' + pct(w) + ' = ' + pts(c.d);
}
const CELL_WORD = {up: 'above', dn: 'below', nm: 'not meaningful', nd: 'N/D'};
function sparkHTML(d){
  if(!d.cells.length) return NDH;
  return '<span class="sa-spark" role="img" aria-label="ROIC above WACC in ' + d.up + ' of ' + d.n + ' years: ' +
    esc(d.cells.map(c => c.y + ' ' + CELL_WORD[c.s]).join(', ')) + '">' +
    d.cells.map(c => '<i class="sa-sc ' + c.s + '" data-tt="' + esc(cellTip(c, d.w)) + '"></i>').join('') + '</span>' +
    '<span class="sa-spark-n">' + (d.n ? d.up + '/' + d.n : 'N/D') + '</span>';
}
function flagsHTML(r){
  const f = r.flags || []; if(!f.length) return '—';
  const cls = f.some(x => x.severity === 'high') ? 'badge-red' : f.some(x => x.severity === 'medium') ? 'badge-gold' : 'sa-badge-info';
  const names = f.map(x => flagTitle(x.id) + ' (' + (x.severity || 'info') + ')');
  return '<span class="badge ' + cls + '" tabindex="0" data-tt="' + esc(names.map(n => '• ' + n).join('\n')) + '" aria-label="' +
    esc(f.length + (f.length > 1 ? ' flags: ' : ' flag: ') + names.join('; ')) + '">' + f.length + '</span>';
}
function rowHTML(r, d){
  const inC = st.compare.indexOf(r.ticker) >= 0, full = st.compare.length >= 4 && !inC;
  const cls = [r.ticker === selected ? 'sel' : '', r.ticker === st.hover ? 'hl' : ''].filter(Boolean).join(' ');
  return '<tr data-t="' + esc(r.ticker) + '" tabindex="0"' + (cls ? ' class="' + cls + '"' : '') + '>' +
    '<td class="sa-td-cmp"><input type="checkbox" class="sa-cmp" data-cmp="' + esc(r.ticker) + '"' + (inC ? ' checked' : '') +
      (full ? ' disabled' : '') + ' aria-label="Compare ' + esc(r.name) + '"></td>' +
    '<td class="sa-td-co"><span class="sa-tk">' + esc(r.ticker) + '</span><span class="sa-co">' + esc(r.name) + '</span></td>' +
    '<td class="l sa-col-sector">' + esc(r.sector) + '</td>' +
    '<td>' + H(pct(d.g)) + '</td>' +
    '<td>' + sgrCell(r, d) + '</td>' +
    '<td>' + gapCell(r, d) + '</td>' +
    '<td class="l">' + sparkHTML(d) + '</td>' +
    '<td>' + H(pctS(r.ecart_pct, 0)) + '</td>' +
    '<td>' + flagsHTML(r) + '</td>' +
    '<td class="l">' + (r.src_kind === 'YF' ? '<span class="sa-nm" tabindex="0" data-tt="' + esc('Secondary source: ' + String(r.source || '').replace(/^.*— /, '') +
      '. Figures come from Yahoo Finance statements, not from the filing itself; they are tested for accounting identities, and against the ESEF report where one exists.') + '">' + esc(SRC_NAME[r.src_kind]) + '</span>' : esc(SRC_NAME[r.src_kind])) +
      ' · ' + esc(String(r.fiscal_year_end || 'N/D').slice(0, 7)) +
      (r.stale_financials ? ' <span class="badge badge-red">old</span>' : '') + '</td></tr>';
}
function renderTable(){
  const tb = $('#sa-tbl tbody'); if(!tb) return;
  const rows = filtered().filter(r => !st.brush || st.brush.has(r.ticker)), D = {};
  rows.forEach(r => { D[r.ticker] = derive(r, st.dW); });
  const k = st.sort.k, dir = st.sort.dir;
  rows.sort((a, b) => {   // N/D and n/m always last, whatever the direction
    const va = SORTV[k](a, D[a.ticker]), vb = SORTV[k](b, D[b.ticker]);
    if(va == null && vb == null) return a.ticker.localeCompare(b.ticker);
    if(va == null) return 1; if(vb == null) return -1;
    return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * dir;
  });
  tb.innerHTML = rows.length ? rows.map(r => rowHTML(r, D[r.ticker])).join('')
    : '<tr><td colspan="10" class="l sa-note">No company in this selection.</td></tr>';
  $$('#sa-tbl th[data-k]').forEach(th => th.setAttribute('aria-sort', th.dataset.k === k ? (dir > 0 ? 'ascending' : 'descending') : 'none'));
  $('#sa-th-g').textContent = 'Implied growth' + (st.dW ? ' (WACC ' + signed(st.dW, 2, ' pt') + ')' : '');
}
function hlRow(scroll){
  const wrap = $('#sa-tbl-wrap');
  $$('#sa-tbl tbody tr[data-t]').forEach(tr => {
    const on = tr.dataset.t === st.hover; tr.classList.toggle('hl', on);
    if(on && scroll && wrap){   // scroll inside the table only, never the page
      const head = ($('#sa-tbl thead') || {}).offsetHeight || 0, top = tr.offsetTop, bot = top + tr.offsetHeight;
      if(top - head < wrap.scrollTop || bot > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = top - head - 8;
    }
  });
}
function syncSelected(){ $$('#sa-tbl tbody tr[data-t]').forEach(tr => tr.classList.toggle('sel', tr.dataset.t === selected)); renderMap(); }
function setHoverFromTable(t){ if(t === st.hover) return; st.hover = t; hlRow(false); renderMap(); }
function renderBrushbar(){
  const bar = $('#sa-brushbar'); if(!bar) return;
  bar.hidden = !st.brush;
  if(st.brush) $('#sa-brush-txt').textContent = st.brush.size + ' compan' + (st.brush.size > 1 ? 'ies' : 'y') + ' selected on the map (' +
    Array.from(st.brush).join(', ') + ') — the table is filtered.';
}
function renderCompare(){
  const el = $('#sa-compare'); if(!el) return;
  const cols = st.compare.map(t => ROW[t]).filter(Boolean);
  if(!cols.length){ el.hidden = true; el.innerHTML = ''; return; }
  const D = cols.map(r => derive(r, st.dW));
  const defs = [
    ['Implied growth', (r, d) => H(pct(d.g))],
    ['Sustainable growth', (r, d) => sgrCell(r, d)],
    ['Gap (implied − sustainable)', (r, d) => gapCell(r, d)],
    ['ROIC > WACC', (r, d) => sparkHTML(d)],
    ['No-growth value (EPV) vs price', r => H(pctS(r.ecart_pct, 0))],
    ['WACC' + (st.dW ? ' (shifted ' + signed(st.dW, 2, ' pt') + ')' : ''), (r, d) => H(pct(d.w))],
    ['Risk-free', r => isNum(r.rf) ? esc((r.rf_currency || '') + ' ' + pct(r.rf)) + (r.rf_proxy ? ' <span class="sa-co">US proxy</span>' : '') : NDH],
    ['Price (accounts currency)', r => H(money(r.prix, r.currency))],
    ['Flags', r => (r.flags || []).length ? r.flags.map(f => esc(flagTitle(f.id))).join('<br>') : '—'],
    ['Accounts', r => esc(SRC_NAME[r.src_kind]) + '<br>FY end ' + esc(r.fiscal_year_end || 'N/D') + (r.stale_financials ? ' <span class="badge badge-red">old</span>' : '')]
  ];
  el.hidden = false;
  el.innerHTML = '<div class="sa-h3"><span>Side by side</span><em>' + cols.length + ' of 4 · kept while you filter</em></div>' +
    '<div class="sa-tbl-wrap"><table class="sa-tbl sa-cmp-tbl"><thead><tr><th class="l" scope="col">Metric</th>' +
    cols.map(r => '<th class="l" scope="col"><span class="sa-tk">' + esc(r.ticker) + '</span><button class="sa-cmp-x" data-uncmp="' + esc(r.ticker) +
      '" aria-label="Remove ' + esc(r.name) + ' from the comparison">✕</button><div class="sa-co" style="margin:2px 0 0">' + esc(r.name) + '</div></th>').join('') +
    '</tr></thead><tbody>' + defs.map(df => '<tr><th class="l" scope="row">' + esc(df[0]) + '</th>' +
      cols.map((r, i) => '<td class="l">' + df[1](r, D[i]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function syncCompareBoxes(){
  const full = st.compare.length >= 4;
  $$('#sa-tbl .sa-cmp').forEach(c => { const on = st.compare.indexOf(c.dataset.cmp) >= 0; c.checked = on; c.disabled = full && !on; });
}
function toggleCompare(t, on){
  const i = st.compare.indexOf(t);
  if(on && i < 0 && st.compare.length < 4) st.compare.push(t);
  if(!on && i >= 0) st.compare.splice(i, 1);
  syncCompareBoxes(); renderCompare();
}
function renderS1(rebuild){ renderMap(rebuild); renderTable(); renderCompare(); renderBrushbar(); }

const ttEl = document.createElement('div'); ttEl.id = 'sa-tt'; ttEl.setAttribute('role', 'tooltip'); document.body.appendChild(ttEl);
function showTT(el){
  ttEl.textContent = el.getAttribute('data-tt'); ttEl.classList.add('on');

      '</td><td>' + H(big(c.second_value)) + '<div class="sa-co" style="margin:0">' + esc(c.second_source_row || '') + '</div></td><td>' +

    (T[t].net_debt_audit || []).forEach(c => { if(c.status === 'gap') ndg.push('<li><span class="sa-tk">' + esc(t) + '</span> ' + esc(String(c.component).replace(/_/g, ' ')) +

    (coh.length ? coh.length + ' out of tolerance:' : 'All within tolerance.') + '</p>' + (coh.length ? '<ul class="sa-note" style="padding-left:18px;margin:0">' + coh.join('') + '</ul>' : '') + '</div>' +
    '<div class="sa-dsec"><h4>Net debt tags</h4><p class="sa-note">Each component of net debt is checked for a tag that stopped being filed in the last two years. ' +
    (ndg.length ? '</p><ul class="sa-note" style="padding-left:18px;margin:0">' + ndg.join('') + '</ul>' : 'No migration detected.</p>') + '</div>';
  const other = [];

/* audit trail (drill-down) — every input of the reverse DCF and the EPV, formulas with the numbers in */
const n_ = v => isNum(v) ? v : null;
const objOf = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
function kv(label, value, sub){ return '<dt>' + esc(label) + '</dt><dd>' + H(value) + '</dd>' + (sub ? '<div class="sub">' + sub + '</div>' : ''); }
function tagLine(fc){
  if(!fc || !fc.xbrl_tag) return '';
  const url = /^https:\/\//.test(fc.edgar_filing_url || '') ? fc.edgar_filing_url : null;
  if(fc.filing_form === 'Yahoo') return 'Yahoo Finance line <code class="sa-mono">' + esc(String(fc.xbrl_tag).replace(/^yahoo:/, '')) +
    '</code> · FY ' + esc(fc.fiscal_year) + ' · secondary source' + (url ? ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">page ↗</a>' : '');
  return 'XBRL <code class="sa-mono">' + esc(fc.xbrl_tag) + '</code> · ' + esc(fc.filing_form || '') + ' FY ' + esc(fc.fiscal_year) +
    (url ? ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">filing ↗</a>' : '');
}
function bandHTML(p3){
  if(p3.some(p => !isNum(p[1]))) return '<p class="sa-note">Sensitivity to WACC: <span class="sa-nd">N/D</span> (needs a positive free cash flow and a known enterprise value).</p>';
  const lo = p3[0][1], hi = p3[2][1], pad = Math.max((hi - lo) * 0.3, 0.004), a = lo - pad, b = hi + pad;
  const pos = v => ((v - a) / (b - a) * 100).toFixed(1);
  return '<div class="sa-kicker" style="margin-top:6px">Implied growth if the WACC moves by one point</div>' +
    '<div class="sa-band" role="img" aria-label="' + esc('Implied growth: ' + pct(lo) + ' at WACC −1 pt, ' + pct(p3[1][1]) + ' at the base WACC, ' + pct(hi) + ' at WACC +1 pt') + '">' +
    '<span class="sa-band-track"></span><span class="sa-band-rng" style="left:' + pos(lo) + '%;width:' + (pos(hi) - pos(lo)).toFixed(1) + '%"></span>' +
    p3.map(p => '<span class="sa-band-m' + (p[0] === 0 ? ' base' : '') + '" style="left:' + pos(p[1]) + '%"></span><span class="sa-band-l" style="left:' + pos(p[1]) + '%">' +
      (p[0] === 0 ? 'base' : p[0] > 0 ? 'WACC +1 pt' : 'WACC −1 pt') + '<br><b>' + esc(pct(p[1])) + '</b></span>').join('') + '</div>';
}
function taxNote(td){
  const rng = Array.isArray(TH.tax_rate_valid_range) ? pct(TH.tax_rate_valid_range[0], 0) + '–' + pct(TH.tax_rate_valid_range[1], 0) : 'the normal range';
  if(td.source === 'median') return 'This year\'s rate (' + esc(pct(n_(td.raw))) + ') is outside ' + esc(rng) + ' (tax credit, one-off or loss): median of the normal years ' +
    esc((td.years || []).join(', ')) + ' used, from the same filings.';
  if(td.source === 'N/D') return 'This year\'s rate (' + esc(pct(n_(td.raw))) + ') is outside ' + esc(rng) + ' and fewer than two earlier years are normal: <span class="sa-nd">N/D</span>, so the EPV is not computed.';
  return 'tax expense / pre-tax income, fiscal year ' + esc((td.years || [])[0] || '');
}
function openDrill(t, opener){
  const row = ROW[t]; if(!row) return;
  openDrawer('Audit trail · ' + t, row.name, '<div class="sa-loading">Loading the filing data…</div>', opener);
  report(t).then(rep => { if(selected === t && $('#sa-drawer').classList.contains('open')) $('#sa-dr-body').innerHTML = drillHTML(row, rep); })
    .catch(err => { $('#sa-dr-body').innerHTML = '<p class="sa-note">Report unavailable (' + esc(err.message) + ').</p>'; });

function drillHTML(row, rep){

let LAB = null;
const lab = {cur: 'USD', pts: {}, swap: {}, preset: 'equal'};
let growthChart = null, crisisChart = null, crisisSel = 'GFC_2008';
const CRISES = [['GFC_2008', 'Financial crisis 2008'], ['Taper_Tantrum_2013', 'Taper tantrum 2013'], ['Volmageddon_2018', 'Volmageddon 2018'],
                ['COVID_2020', 'Covid crash 2020'], ['Hike_Cycle_2022', 'Rate-hike cycle 2022']];
function positions(){   // current rows → [{t, cur, name, sector, base, w}]
  const tot = LAB.holdings.reduce((s, h) => s + (lab.pts[h.t] || 0), 0) || 1;
  return LAB.holdings.map(h => {
    const c = lab.swap[h.t] && LAB.competitors[h.t];
    return {t: c ? c.t : h.t, cur: (c ? c.cur : h.cur) || 'USD', name: c ? c.name : h.name, sector: h.sector, base: h.t, w: (lab.pts[h.t] || 0) / tot};
  });
}
function benchSeries(B, R){ return refSeries(B, B.r.ACWI ? 'ACWI' : 'SPY', 'USD', R); }
/* risk-free of the measuring currency: the 10-year yield the valuation map uses for it
 * (HKD is pegged to the dollar → USD) */
function rfFor(cur){
  const pick = c => (ROWS.find(r => r.rf_currency === c && !r.rf_proxy && isNum(r.rf)) || {}).rf;
  const v = pick(cur === 'HKD' ? 'USD' : cur);
  return {rf: isNum(v) ? v : pick('USD'), cur: isNum(v) ? (cur === 'HKD' ? 'USD (HKD peg)' : cur) : 'USD'};
}

function presetWeights(name){
  const H = LAB.holdings; let w = {};
  if(name === 'hrp') H.forEach(h => { w[h.t] = Math.max(0, +(LAB.presets.hrp || {})[h.t] || 0); });
  else if(name === 'invvol'){
    const pos = positions();
    H.forEach((h, k) => { const q = pos[k], r = refSeries(LAB.M, q.t, q.cur, lab.cur); if(!r){ w[h.t] = 0; return; }
      const a = Array.from(r).filter(isFinite), m = avg(a), sd = Math.sqrt(avg(a.map(v => (v - m) * (v - m))));
      w[h.t] = sd > 0 ? 1 / sd : 0; });
  } else if(name === 'mine'){ try{ w = JSON.parse(localStorage.getItem('sainhe_lab_mix') || '{}').pts || {}; }catch(e){ w = {}; } }
  else if(name === 'maxsharpe' || name === 'minvol' || name === 'lowbeta'){ w = optimisedWeights(name); if(!w) return; }
  else H.forEach(h => { w[h.t] = 1; });
  const mx = Math.max.apply(null, H.map(h => w[h.t] || 0)) || 1;
  H.forEach(h => { lab.pts[h.t] = name === 'mine' ? Math.round(w[h.t] || 0) : Math.round((w[h.t] || 0) / mx * 50); });
  lab.preset = name;
  $$('#sa-lab-card .sa-chip[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === name));
}
/* Optimiser on the companies the user keeps (weight > 0): long-only, at most OPT_CAP per name,
 * fitted on the days all of them have prices. In-sample by construction, so an out-of-sample
 * check is shown next to it: fitted on the first 60% of the days, held on the last 40%. */
const OPT_CAP = 0.2, OPT_LOWBETA = 0.6, OPT_SPLIT = 0.6;
function optimisedWeights(name){
  const B = LAB.M, R = lab.cur, pos = positions();
  let picks = pos.map((q, k) => ({q, h: LAB.holdings[k]})).filter(x => x.q.w > 0);
  if(picks.length < 2) picks = pos.map((q, k) => ({q, h: LAB.holdings[k]}));
  const ser = picks.map(x => refSeries(B, x.q.t, x.q.cur, R));
  const ok = picks.filter((x, k) => ser[k]), S = ser.filter(Boolean);
  const rows = aligned(S), RF = rfFor(R), bench = benchSeries(B, R);
  if(rows.length < 60){ lab.optNote = '<span class="sa-nd">N/D</span>: fewer than 60 days with prices for all the companies you kept.'; return null; }
  const mode = name === 'minvol' ? 'minvol' : 'sharpe', betaCap = name === 'lowbeta' ? OPT_LOWBETA : undefined;
  const m = moments(S, rows, bench), wv = optimize(m, {mode, rf: RF.rf, cap: Math.max(OPT_CAP, 1 / S.length), betaCap});
  const cut = Math.floor(rows.length * OPT_SPLIT), fitRows = rows.slice(0, cut), testRows = rows.slice(cut);
  const wFit = optimize(moments(S, fitRows, bench), {mode, rf: RF.rf, cap: Math.max(OPT_CAP, 1 / S.length), betaCap});
  const eqW = S.map(() => 1 / S.length), tOpt = evaluate(S, testRows, wFit, RF.rf), tEq = evaluate(S, testRows, eqW, RF.rf);
  const d = i => B.dates[i], beta = m.beta ? m.beta.reduce((s, b, i) => s + b * wv[i], 0) : null;
  const label = {maxsharpe: 'Best Sharpe ratio', minvol: 'Lowest volatility', lowbeta: 'Best Sharpe with market beta ≤ ' + OPT_LOWBETA}[name];
  lab.optNote = '<strong>' + esc(label) + '</strong> on the ' + S.length + ' companies you kept, at most ' + pct(Math.max(OPT_CAP, 1 / S.length), 0) +
    ' each, fitted on ' + esc(d(rows[0])) + ' → ' + esc(d(rows[rows.length - 1])) + ' (' + rows.length + ' days, in ' + esc(R) + ')' +
    (isNum(beta) ? ', beta vs ACWI ' + esc(num(beta, 2)) : '') + '. Fitted on the past, it looks better than it will. ' +
    '<strong>Out-of-sample check:</strong> fitted on ' + esc(d(fitRows[0])) + ' → ' + esc(d(fitRows[fitRows.length - 1])) + ', then held ' +
    esc(d(testRows[0])) + ' → ' + esc(d(testRows[testRows.length - 1])) + ': Sharpe ' + H(isNum(tOpt.sharpe) ? num(tOpt.sharpe, 2) : 'N/D') +
    ' vs ' + H(isNum(tEq.sharpe) ? num(tEq.sharpe, 2) : 'N/D') + ' for equal weights, volatility ' + H(pct(tOpt.vol)) + ' vs ' + H(pct(tEq.vol)) +
    '. Set a company to 0 to leave it out. Not a recommendation.';
  const w = {}; ok.forEach((x, k) => { w[x.h.t] = wv[k]; });
  return w;
}

function syncSliders(){

function renderLabStats(){

  const B = LAB.M, R = lab.cur, P = pal(), pos = positions();
  const port = portfolio(B, pos, R), loc = portfolio(B, pos, R, true);
  const eqPos = pos.map(q => Object.assign({}, q, {w: 1 / pos.length})), eq = portfolio(B, eqPos, R);
  const bench = benchSeries(B, R);
  const RF = rfFor(R);
  const st = stats(B, port.p, bench, RF.rf), sl = stats(B, loc.p, null), se = stats(B, eq.p, bench, RF.rf);
  const bp = new Float64Array(B.dates.length); for(let i = 1; i < bp.length; i++) bp[i] = bench && isFinite(bench[i]) ? bench[i] : 0;
  const sb = stats(B, bp, bench, RF.rf);
  $('#sa-lab-cur').textContent = R;
  $('#sa-lab-period').textContent = B.dates[0] + ' → ' + B.dates[B.dates.length - 1];
  const tile = (l, v, c) => '<div class="sa-m"><div class="sa-m-l">' + esc(l) + '</div><div class="sa-m-v">' + H(v) + '</div><div class="sa-m-c">' + c + '</div></div>';
  $('#sa-metrics').innerHTML =
    tile('Return a year', pct(st.cagr), 'ACWI ' + H(pct(sb.cagr)) + ' · equal ' + H(pct(se.cagr))) +
    tile('Volatility', pct(st.vol), 'ACWI ' + H(pct(sb.vol))) +
    tile('Worst drawdown', pct(st.mdd), 'ACWI ' + H(pct(sb.mdd))) +
    tile('1-day loss, 95%', pct(st.var95, 2), 'average beyond (CVaR) ' + H(pct(st.cvar95, 2))) +
    tile('Beta vs ACWI', isNum(st.beta) ? num(st.beta, 2) : 'N/D', 'both measured in ' + esc(R)) +
    tile('Currency effect', pts(st.vol - sl.vol), 'on volatility · ' + H(pts(isNum(st.cagr) && isNum(sl.cagr) ? st.cagr - sl.cagr : null)) + ' on return') +
    tile('Sharpe ratio', isNum(st.sharpe) ? num(st.sharpe, 2) : 'N/D', 'ACWI ' + H(isNum(sb.sharpe) ? num(sb.sharpe, 2) : 'N/D') + ' · risk-free ' + esc(RF.cur) + ' ' + H(pct(RF.rf))) +
    tile('Sortino ratio', isNum(st.sortino) ? num(st.sortino, 2) : 'N/D', 'like Sharpe, counting only falls');

  const ds = [{label: 'Your allocation', data: a, borderColor: P.s1, backgroundColor: P.s1, borderWidth: 2.2, pointRadius: 0, tension: 0},
              {label: 'Equal weight', data: e, borderColor: P.s3, backgroundColor: P.s3, borderWidth: 1.6, pointRadius: 0, tension: 0},
              {label: 'MSCI ACWI (ETF)', data: b, borderColor: P.s2, backgroundColor: P.s2, borderWidth: 1.6, pointRadius: 0, tension: 0}];
  if(growthChart){ growthChart.data.labels = lab_; growthChart.data.datasets = ds; growthChart.update('none'); }
  else growthChart = lineChart($('#sa-growth'), lab_, ds, R);
  // risk contributions (top 8 by risk share)
  const rc = riskContrib(pos, port.ser, port.p);
  const items = pos.map((q, k) => ({l: q.t, w: q.w, r: rc[k]})).filter(x => x.w > 0).sort((x, y) => y.r - x.r).slice(0, 8);
  const scale = Math.max.apply(null, items.map(x => Math.max(x.w, x.r)).concat([0.01]));
  bars($('#sa-risk'), items.map(x => Object.assign(x, {scale})), x => pct(x.w) + ' → ' + pct(x.r));
  // exposures
  const agg = key => { const m = {}; pos.forEach(q => { m[q[key]] = (m[q[key]] || 0) + q.w; }); return Object.keys(m).map(k => ({l: k, r: m[k]})).filter(x => x.r > 0.0005).sort((x, y) => y.r - x.r); };

function saveHash(){ clearTimeout(hashT); hashT = setTimeout(() => { if(/^#lab=|^#$|^$/.test(location.hash) || lab.preset === 'custom' || Object.keys(lab.swap).length){
  try{ history.replaceState(null, '', '#' + hashState()); }catch(e){} } }, 400); }
function readHash(){
  let hs = location.hash; try{ hs = decodeURIComponent(hs); }catch(e){}   // browsers may store « | » as %7C
  const m = /^#lab=([^|]*)\|([^|]*)\|?(.*)$/.exec(hs); if(!m) return false;
  const c = decodeURIComponent(m[1]); if(LAB.currencies_display.indexOf(c) >= 0) lab.cur = c;
  m[2].split(',').forEach(x => { const i = x.lastIndexOf('~'); if(i > 0){ const t = decodeURIComponent(x.slice(0, i)); if(LAB.holdings.some(h => h.t === t)) lab.pts[t] = Math.max(0, Math.min(100, +x.slice(i + 1) || 0)); } });

  lab.preset = 'custom'; return true;

/* ═════════════ 4b · RANGE OF OUTCOMES (Monte Carlo) ═════════════ */
const mc = {amount: 10000, years: 5};
const MC_PATHS = 2000, MC_BLOCK = 21, MC_SEED = 20261122;
let mcChart = null, mcT = 0;
function scheduleMC(){ clearTimeout(mcT); mcT = setTimeout(renderMC, 120); }
function fmtMoney(v, cur){ return isNum(v) ? cur + ' ' + Math.round(v).toLocaleString('en-US') : 'N/D'; }
function renderMC(){
  if(!LAB || !$('#sa-mc')) return;
  const B = LAB.M, R = lab.cur, P = pal(), pos = positions(), A = mc.amount, Y = mc.years;
  const ret = Array.from(portfolio(B, pos, R).p).slice(1).filter(isFinite);
  const bench = benchSeries(B, R), bret = bench ? Array.from(bench).slice(1).map(v => isFinite(v) ? v : 0) : null;
  const o = {days: Y * 252, paths: MC_PATHS, block: MC_BLOCK, step: 21, seed: MC_SEED};
  const res = bootstrap(ret, o), bres = bret ? bootstrap(bret, o) : null, f = res.final;
  $('#sa-mc-cur').textContent = R;
  $('#sa-mc-lede').innerHTML = 'If the next <strong>' + Y + (Y > 1 ? ' years' : ' year') + '</strong> looked like a reshuffled version of the last five, half of the ' +
    MC_PATHS.toLocaleString('en-US') + ' paths would end above <strong>' + esc(fmtMoney(A * f.p50, R)) + '</strong>, and 9 in 10 between <strong>' +
    esc(fmtMoney(A * f.p5, R)) + '</strong> and <strong>' + esc(fmtMoney(A * f.p95, R)) + '</strong>. In <strong>' + esc(pct(res.probLoss, 0)) +

  const tile = (l, v, c) => '<div class="sa-m"><div class="sa-m-l">' + esc(l) + '</div><div class="sa-m-v">' + H(v) + '</div><div class="sa-m-c">' + c + '</div></div>';
  const vs = (k, fm) => bres ? 'MSCI ACWI ' + H(fm(bres, k)) : '';

    tile('Middle outcome', fmtMoney(A * f.p50, R), vs('p50', (r, k) => fmtMoney(A * r.final[k], R))) +
    tile('Bad case, 1 in 20', fmtMoney(A * f.p5, R), vs('p5', (r, k) => fmtMoney(A * r.final[k], R))) +
    tile('Good case, 1 in 20', fmtMoney(A * f.p95, R), vs('p95', (r, k) => fmtMoney(A * r.final[k], R))) +
    tile('Chance to end below your money', pct(res.probLoss, 0), vs('', r => pct(r.probLoss, 0))) +
    tile('Typical worst fall on the way', pct(res.medianMdd, 0), vs('', r => pct(r.medianMdd, 0))) +
    tile('Chance of a fall of 30% or more', pct(res.probDD30, 0), vs('', r => pct(r.probDD30, 0)));

  const mk = k => res.bands[k].map(v => A * v);
  const ds = [
    {label: '5th percentile', data: mk('p5'), borderColor: 'rgba(0,0,0,0)', pointRadius: 0, fill: false},
    {label: '5–95% of paths', data: mk('p95'), borderColor: 'rgba(0,0,0,0)', backgroundColor: alpha(P.s1, .14), pointRadius: 0, fill: 0},
    {label: '25th percentile', data: mk('p25'), borderColor: 'rgba(0,0,0,0)', pointRadius: 0, fill: false},
    {label: '25–75% of paths', data: mk('p75'), borderColor: 'rgba(0,0,0,0)', backgroundColor: alpha(P.s1, .3), pointRadius: 0, fill: 2},
    {label: 'Middle path (median)', data: mk('p50'), borderColor: P.s1, borderWidth: 2.2, pointRadius: 0, fill: false}];
  if(bres) ds.push({label: 'MSCI ACWI median', data: bres.bands.p50.map(v => A * v), borderColor: P.s2, borderDash: [5, 4], borderWidth: 1.6, pointRadius: 0, fill: false});
  if(mcChart) mcChart.destroy();
  mcChart = new Chart($('#sa-mc'), {type: 'line', data: {labels, datasets: ds}, options: {
    responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: 'index', intersect: false},
    scales: {x: axis(P, {grid: {display: false}, ticks: {color: P.muted, autoSkip: false, maxRotation: 0, callback: function(v){ return this.getLabelForValue(v); }}}),
             y: axis(P, {ticks: {color: P.muted, maxTicksLimit: 6, callback: v => big(v)}})},
    plugins: {legend: {display: true, position: 'top', align: 'end', labels: {color: P.p, boxWidth: 14, filter: it => !/percentile/.test(it.text)}},
      tooltip: Object.assign(tip(P), {filter: it => !/percentile/.test(it.dataset.label), callbacks: {
        title: it => 'Month ' + it[0].dataIndex, label: it => it.dataset.label + '  ' + fmtMoney(it.raw, R)}})}

    ' daily returns since ' + esc(B.dates[0]) + ', in ' + esc(R) + ', rebalanced every day to your weights. Blocks keep the clustering of real markets: a bad week tends to follow a bad week. ' +
    '<strong>This is the spread recent history implies, not a forecast.</strong> The last five years include the 2022 rate shock but not a 2008-style crash — see the crisis replay below: the real bad case can be worse than any path here.';

/* ═════════════ 5 · CRISIS REPLAY ═════════════ */
function crisisRun(B, pos, R){
  const n = B.dates.length;
  const avail = pos.map(q => { const r = B.r[q.t]; if(!r) return false; let k = 0; for(let i = 1; i < n; i++) if(isFinite(r[i])) k++; return k >= 0.9 * (n - 1); });
  const inc = pos.filter((q, k) => avail[k] && q.w > 0), wtot = pos.reduce((s, q) => s + q.w, 0) || 1;
  const covW = inc.reduce((s, q) => s + q.w, 0) / wtot;
  const a = portfolio(B, inc, R), eqList = pos.filter((q, k) => avail[k]);
  const e = portfolio(B, eqList.map(q => Object.assign({}, q, {w: 1})), R);
  const bench = benchSeries(B, R), bp = new Float64Array(n); for(let i = 1; i < n; i++) bp[i] = bench && isFinite(bench[i]) ? bench[i] : 0;
  return {a: stats(B, a.p, null), e: stats(B, e.p, null), b: stats(B, bp, null), nInc: inc.length, nPos: pos.filter(q => q.w > 0).length, covW,
    missing: pos.filter((q, k) => !avail[k] && q.w > 0).map(q => q.t)};
}
function renderCrisis(){
  if(!LAB) return;
  const pos = positions(), R = lab.cur, P = pal(), tb = $('#sa-crisis-tbl tbody');
  const res = {};
  CRISES.forEach(([k]) => { if(LAB.C[k]) res[k] = crisisRun(LAB.C[k], pos, R); });
  tb.innerHTML = CRISES.filter(([k]) => res[k]).map(([k, l]) => { const r = res[k], B = LAB.C[k];
    return '<tr data-c="' + k + '"' + (k === crisisSel ? ' class="sel"' : '') + ' tabindex="0"><td class="l">' + esc(l) + '</td><td>' + esc(B.start) + ' → ' + esc(B.end) + '</td>' +
      '<td>' + H(pctS(r.a.total)) + '</td><td>' + H(pct(r.a.mdd)) + '</td><td>' + H(pctS(r.e.total)) + '</td><td>' + H(pctS(r.b.total)) + '</td>' +
      '<td class="l" title="' + esc(r.missing.length ? 'Not listed then: ' + r.missing.join(', ') : 'All holdings listed') + '">' + r.nInc + '/' + r.nPos + ' holdings · ' + pct(r.covW, 0) + ' of weight' +
      (r.missing.length ? ' <span class="sa-co">missing ' + esc(r.missing.slice(0, 4).join(', ')) + (r.missing.length > 4 ? '…' : '') + '</span>' : '') + '</td></tr>'; }).join('');
  const pick = $('#sa-crisis-pick');
  pick.innerHTML = '<span class="sa-kicker">Replay</span>' + CRISES.filter(([k]) => res[k]).map(([k, l]) => '<button class="sa-chip' + (k === crisisSel ? ' on' : '') + '" data-c="' + k + '" aria-pressed="' + (k === crisisSel) + '">' + esc(l) + '</button>').join('') +
    '<span class="sa-sep" aria-hidden="true"></span><span class="sa-note">measured in ' + esc(R) + ' · window starts one week before the shock</span>';
  const B = LAB.C[crisisSel], r = res[crisisSel]; if(!B || !r) return;
  const ds = [{label: 'Your allocation', data: r.a.path, borderColor: P.s1, backgroundColor: P.s1, borderWidth: 2.2, pointRadius: 0, tension: 0},
              {label: 'Equal weight', data: r.e.path, borderColor: P.s3, backgroundColor: P.s3, borderWidth: 1.6, pointRadius: 0, tension: 0},
              {label: 'MSCI ACWI (ETF)', data: r.b.path, borderColor: P.s2, backgroundColor: P.s2, borderWidth: 1.6, pointRadius: 0, tension: 0}];
  if(crisisChart){ crisisChart.data.labels = B.dates; crisisChart.data.datasets = ds; crisisChart.update('none'); }
  else { crisisChart = lineChart($('#sa-crisis'), B.dates, ds, R); crisisChart.options.scales.x.ticks.callback = function(v){ return String(this.getLabelForValue(v)).slice(0, 10); }; crisisChart.update('none'); }
}
$('#sa-crisis-pick').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(b){ crisisSel = b.dataset.c; renderCrisis(); } });
