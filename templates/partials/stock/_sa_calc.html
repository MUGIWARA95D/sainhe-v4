<script>
/* ══════ STOCK ANALYSIS — pure arithmetic (window.SACALC) ══════════════════════
 * No DOM, no network: everything here is tested under Node (tests_front/test_calc.js)
 * against the Python engine's own outputs. The page script only renders.
 * ════════════════════════════════════════════════════════════════════════════ */
window.SACALC = (function(){
'use strict';
const isNum = v => typeof v === 'number' && isFinite(v);
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
const TRADING_DAYS = 252;

/* — section 01: one company at a WACC shifted by dW — */
function derive(r, dW){
  const w = isNum(r.wacc) ? r.wacc + dW : null, R = r.rdcf || {};
  let g = null;
  if(dW === 0) g = isNum(r.implied_growth) ? r.implied_growth : null;
  else if(isNum(w) && isNum(R.ev) && isNum(R.fcf_adj) && R.fcf_adj > 0) g = (w * R.ev - R.fcf_adj) / (R.ev + R.fcf_adj);
  const nm = new Set(r.roic_nm_years || []), by = r.roic_by_year || {};
  const cells = Object.keys(by).sort().map(y => {
    const v = by[y];
    if(nm.has(y)) return {y, s: 'nm', v: isNum(v) ? v : null};
    if(!isNum(v) || !isNum(w)) return {y, s: 'nd', v: isNum(v) ? v : null};
    return {y, v, d: v - w, s: v > w ? 'up' : 'dn'};
  });
  const valid = cells.filter(c => c.s === 'up' || c.s === 'dn'), up = valid.filter(c => c.s === 'up').length;
  const sgrOk = r.sgr_status === 'ok' && isNum(r.sgr), sgrNm = r.sgr_status === 'n/m';
  const gap = isNum(g) && sgrOk ? g - r.sgr : (sgrNm ? 'n/m' : null);
  return {w, g, cells, up, n: valid.length, share: valid.length ? up / valid.length : null, sgrOk, sgrNm, gap};
}

/* — section 02: reverse DCF on the user's inputs — */
const simEV = S => S.price * S.shares + S.nd;
const simImplied = (S, fcf, w) => { const ev = simEV(S); return (w * ev - fcf) / (ev + fcf); };
const simValue = (S, g, w, fcf) => (fcf * (1 + g) / (w - g) - S.nd) / S.shares;

/* — Lab: daily returns (1e-5 integers), FX in "USD per unit" — */
function decode(b){
  const r = {}; for(const t in b.r) r[t] = Float64Array.from(b.r[t], v => v == null ? NaN : v / 1e5);
  return {dates: b.dates, r, fx: b.fx_usd || {}, start: b.start, end: b.end, memo: {}};
}
function refSeries(B, t, cur, R){                 // returns of t (quoted in cur) measured in R
  const key = t + '|' + R; if(B.memo[key]) return B.memo[key];
  const r = B.r[t]; if(!r) return null;
  const fc = cur === 'USD' ? null : B.fx[cur], fr = R === 'USD' ? null : B.fx[R];
  if((cur !== 'USD' && !fc) || (R !== 'USD' && !fr)) return null;
  const n = r.length, out = new Float64Array(n); out[0] = NaN;
  for(let i = 1; i < n; i++){
    if(!isFinite(r[i])){ out[i] = NaN; continue; }
    const x1 = (fc ? fc[i] : 1) / (fr ? fr[i] : 1), x0 = (fc ? fc[i - 1] : 1) / (fr ? fr[i - 1] : 1);
    out[i] = (1 + r[i]) * (x1 / x0) - 1;
  }
  return (B.memo[key] = out);
}
function portfolio(B, pos, R, local){              // daily rebalanced; unlisted days → weights rescaled
  const n = B.dates.length, p = new Float64Array(n), ser = pos.map(q => local ? (B.r[q.t] || null) : refSeries(B, q.t, q.cur, R));
  for(let i = 1; i < n; i++){
    let s = 0, ws = 0;
    for(let k = 0; k < pos.length; k++){ const v = ser[k] ? ser[k][i] : NaN; if(pos[k].w > 0 && isFinite(v)){ s += pos[k].w * v; ws += pos[k].w; } }
    p[i] = ws > 0 ? s / ws : 0;
  }
  return {p, ser};
}
function stats(B, p, b, rf){                       // rf: annual risk-free rate of the measuring currency
  let cum = 1, peak = 1, mdd = 0; const arr = [], path = [100];
  for(let i = 1; i < p.length; i++){ cum *= 1 + p[i]; if(cum > peak) peak = cum; mdd = Math.min(mdd, cum / peak - 1); arr.push(p[i]); path.push(cum * 100); }
  const yrs = (new Date(B.dates[B.dates.length - 1]) - new Date(B.dates[0])) / (365.25 * 864e5);
  const m = avg(arr), sd = Math.sqrt(avg(arr.map(v => (v - m) * (v - m))));
  const s = arr.slice().sort((x, y) => x - y), k = Math.max(0, Math.floor(0.05 * s.length) - 1);
  let beta = null;
  if(b){ const xs = [], ys = []; for(let i = 1; i < p.length; i++) if(isFinite(b[i])){ xs.push(b[i]); ys.push(p[i]); }
    const mx = avg(xs), my = avg(ys); let cv = 0, vx = 0; for(let i = 0; i < xs.length; i++){ cv += (xs[i] - mx) * (ys[i] - my); vx += (xs[i] - mx) * (xs[i] - mx); }
    beta = vx > 0 ? cv / vx : null; }
  let sharpe = null, sortino = null;
  if(isNum(rf) && sd > 0){
    const rd = rf / TRADING_DAYS, down = Math.sqrt(avg(arr.map(v => Math.min(0, v - rd) ** 2)));
    sharpe = (m * TRADING_DAYS - rf) / (sd * Math.sqrt(TRADING_DAYS));
    sortino = down > 0 ? (m * TRADING_DAYS - rf) / (down * Math.sqrt(TRADING_DAYS)) : null;
  }
  return {total: cum - 1, cagr: yrs > 0 ? Math.pow(cum, 1 / yrs) - 1 : null, vol: sd * Math.sqrt(TRADING_DAYS), mdd,
    var95: -s[k], cvar95: -avg(s.slice(0, k + 1)), beta, sharpe, sortino, path};
}
function riskContrib(pos, ser, p){                 // share of variance: w_i · cov(r_i, p) / var(p)
  const n = p.length, mp = avg(Array.from(p).slice(1)); let vp = 0; for(let i = 1; i < n; i++) vp += (p[i] - mp) * (p[i] - mp);
  return pos.map((q, k) => { const r = ser[k]; if(!r || !(q.w > 0) || vp <= 0) return 0;
    let c = 0; for(let i = 1; i < n; i++){ const v = isFinite(r[i]) ? r[i] : 0; c += v * (p[i] - mp); }
    return q.w * c / vp; });
}

/* — Monte Carlo: block bootstrap of the allocation's own daily returns — */
function rng(seed){                                // mulberry32: same seed → same paths on every reload
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function quantile(sorted, q){ if(!sorted.length) return NaN; const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); }
/* ret: finite daily returns. Blocks of `block` consecutive days drawn at random keep the
 * volatility clustering of real markets (a crash is followed by more big moves). */
function bootstrap(ret, o){
  const n = ret.length, rand = rng(o.seed || 1), step = o.step || 21, block = o.block || 21, days = o.days, paths = o.paths;
  const nCk = Math.floor(days / step) + 1, ck = Array.from({length: nCk}, () => new Float64Array(paths));
  const finals = new Float64Array(paths), mdds = new Float64Array(paths);
  for(let p = 0; p < paths; p++){
    let v = 1, peak = 1, mdd = 0, d = 0; ck[0][p] = 1;
    while(d < days){
      const s = Math.floor(rand() * n);
      for(let j = 0; j < block && d < days; j++){
        v *= 1 + ret[(s + j) % n]; d++;
        if(v > peak) peak = v; else if(v / peak - 1 < mdd) mdd = v / peak - 1;
        if(d % step === 0) ck[d / step][p] = v;
      }
    }
    finals[p] = v; mdds[p] = mdd;
  }
  const Q = [0.05, 0.25, 0.5, 0.75, 0.95], bands = {p5: [], p25: [], p50: [], p75: [], p95: []}, keys = Object.keys(bands);
  ck.forEach(c => { const s = Array.from(c).sort((x, y) => x - y); Q.forEach((q, i) => bands[keys[i]].push(quantile(s, q))); });
  const sf = Array.from(finals).sort((x, y) => x - y), sm = Array.from(mdds).sort((x, y) => x - y);
  return {bands, step, final: {p5: quantile(sf, .05), p25: quantile(sf, .25), p50: quantile(sf, .5), p75: quantile(sf, .75), p95: quantile(sf, .95)},
    probLoss: sf.filter(v => v < 1).length / paths, medianMdd: quantile(sm, .5),
    probDD30: sm.filter(v => v <= -0.3).length / paths, paths, days, sample: n};
}

/* — optimiser: long-only, cap per name, on the days all chosen names have prices — */
function aligned(series){                          // rows where every series is finite
  const n = series.length ? series[0].length : 0, rows = [];
  for(let i = 1; i < n; i++) if(series.every(s => s && isFinite(s[i]))) rows.push(i);
  return rows;
}
function moments(series, rows, bench){
  const k = series.length, T = rows.length, mu = new Array(k).fill(0), cov = Array.from({length: k}, () => new Array(k).fill(0));
  for(const i of rows) for(let a = 0; a < k; a++) mu[a] += series[a][i] / T;
  for(const i of rows) for(let a = 0; a < k; a++){ const da = series[a][i] - mu[a]; for(let b = a; b < k; b++) cov[a][b] += da * (series[b][i] - mu[b]) / (T - 1); }
  for(let a = 0; a < k; a++) for(let b = 0; b < a; b++) cov[a][b] = cov[b][a];
  let beta = null;
  if(bench){ const bv = rows.map(i => isFinite(bench[i]) ? bench[i] : 0), mb = avg(bv); let vb = 0; bv.forEach(x => { vb += (x - mb) ** 2; });
    beta = series.map((s, a) => { let c = 0; rows.forEach((i, j) => { c += (s[i] - mu[a]) * (bv[j] - mb); }); return vb > 0 ? c / vb : 0; }); }
  return {mu, cov, beta, T};
}
function projectCapped(v, cap){                    // closest weights with 0 ≤ w ≤ cap and Σw = 1
  const n = v.length; cap = Math.max(cap, 1 / n);
  let lo = Math.min.apply(null, v) - cap, hi = Math.max.apply(null, v);
  for(let it = 0; it < 100; it++){ const tau = (lo + hi) / 2; let s = 0; for(const x of v) s += Math.min(cap, Math.max(0, x - tau)); if(s > 1) lo = tau; else hi = tau; }
  const tau = (lo + hi) / 2; return v.map(x => Math.min(cap, Math.max(0, x - tau)));
}
const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
const mat = (M, w) => M.map(row => dot(row, w));
/* mode 'sharpe': max (w·μ − rf)/σ ; 'minvol': min σ ; betaCap: penalty λ·(β_p − cap)² above the cap */
function optimize(m, o){
  const n = m.mu.length, rf = (o.rf || 0) / TRADING_DAYS, cap = o.cap || 1, lambda = 2000;   // beta cap: stiff penalty
  const f = w => { const sw = mat(m.cov, w), sd = Math.sqrt(Math.max(dot(w, sw), 1e-18));
    let v = o.mode === 'minvol' ? -sd : (dot(w, m.mu) - rf) / sd;
    if(isNum(o.betaCap) && m.beta){ const bp = dot(w, m.beta); if(bp > o.betaCap) v -= lambda * (bp - o.betaCap) ** 2 * (o.mode === 'minvol' ? 0.01 : 1); }
    return v; };
  const grad = w => { const sw = mat(m.cov, w), sd = Math.sqrt(Math.max(dot(w, sw), 1e-18)), a = dot(w, m.mu) - rf;
    let g = o.mode === 'minvol' ? sw.map(x => -x / sd) : m.mu.map((x, i) => x / sd - a * sw[i] / (sd ** 3));
    if(isNum(o.betaCap) && m.beta){ const bp = dot(w, m.beta); if(bp > o.betaCap) g = g.map((x, i) => x - 2 * lambda * (bp - o.betaCap) * m.beta[i] * (o.mode === 'minvol' ? 0.01 : 1)); }
    return g; };
  let w = projectCapped(new Array(n).fill(1 / n), cap), best = w, fb = f(w), stepSize = 0.05;
  for(let it = 0; it < (o.iters || 3000); it++){
    const g = grad(w), norm = Math.sqrt(dot(g, g)) || 1;
    w = projectCapped(w.map((x, i) => x + stepSize * g[i] / norm), cap);
    const fv = f(w); if(fv > fb){ fb = fv; best = w; }
    stepSize *= 0.998;
  }
  return best;
}
/* weights applied on a slice of rows: annual return, volatility, Sharpe (for the out-of-sample check) */
function evaluate(series, rows, w, rf){
  const p = rows.map(i => series.reduce((s, sr, k) => s + w[k] * sr[i], 0));
  const m = avg(p), sd = Math.sqrt(avg(p.map(v => (v - m) ** 2)));
  return {ret: m * TRADING_DAYS, vol: sd * Math.sqrt(TRADING_DAYS), sharpe: sd > 0 ? (m * TRADING_DAYS - (rf || 0)) / (sd * Math.sqrt(TRADING_DAYS)) : null};
}

return {isNum, avg, derive, simEV, simImplied, simValue, decode, refSeries, portfolio, stats, riskContrib,
        rng, quantile, bootstrap, aligned, moments, projectCapped, optimize, evaluate, TRADING_DAYS};
})();
</script>
